// ============================================================================
// window.storage polyfill — NIVA's persistence layer (Feature: local data).
// The original app was built for Claude.ai's Artifacts environment, where
// `window.storage` is provided natively. Outside that environment (GitHub
// Pages, any static host) it doesn't exist, so this polyfill backs it with
// the browser's own localStorage instead. Same get/set/delete/list shape,
// same async signatures — nothing else in the app below had to change.
// Data stays on THIS device/browser only (localStorage is not shared across
// devices) — that mirrors the "personal data" (non-shared) mode NIVA already
// uses; there is no "shared" mode to polyfill since NIVA never uses one.
// ============================================================================
window.storage = {
  async get(key) {
    try {
      const raw = window.localStorage.getItem(key);
      if (raw === null) return null;
      return { key, value: raw, shared: false };
    } catch (e) {
      return null;
    }
  },
  async set(key, value) {
    try {
      window.localStorage.setItem(key, value);
      return { key, value, shared: false };
    } catch (e) {
      return null; // e.g. localStorage full or disabled (private browsing) — caller already handles a null/failed save
    }
  },
  async delete(key) {
    try {
      window.localStorage.removeItem(key);
      return { key, deleted: true, shared: false };
    } catch (e) {
      return null;
    }
  },
  async list(prefix) {
    try {
      const keys = [];
      for (let i = 0; i < window.localStorage.length; i++) {
        const k = window.localStorage.key(i);
        if (k && (!prefix || k.startsWith(prefix))) keys.push(k);
      }
      return { keys, prefix, shared: false };
    } catch (e) {
      return null;
    }
  },
};

const uid = () => {
  if (typeof crypto !== "undefined" && typeof crypto.randomUUID === "function") return crypto.randomUUID();
  // Fallback for environments without crypto.randomUUID — still low collision risk for a
  // single-user client-side beta, but crypto.randomUUID is preferred whenever available.
  return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4) + Math.random().toString(36).slice(2, 6);
};

// Parses a number input defensively: NaN/Infinity/empty become 0 (never propagate NaN into a
// financial total), and the result is clamped to [min, max] when given. Negative revenue, negative
// counts, and out-of-range percentages are rejected here rather than trusted from the raw <input>.
function safeNum(raw, { min = 0, max = Infinity } = {}) {
  const n = Number(raw);
  if (!Number.isFinite(n)) return min;
  return Math.min(max, Math.max(min, n));
}

/* migrated additively; nothing is ever deleted by a migration.         */
/* ------------------------------------------------------------------ */

const SETTINGS_SCHEMA_VERSION = 1;
const SESSIONS_SCHEMA_VERSION = 1;
const VALID_PLATFORMS = ["twitch", "kick", "youtube"];

function validatePlatform(p) {
  return VALID_PLATFORMS.includes(p);
}

function validateCurrency(c) {
  return typeof c === "string" && CURRENCIES.includes(c);
}

// Deep-merges saved settings onto DEFAULT_SETTINGS so a settings object saved before a field
// existed (e.g. accountStatus, subProgram) never silently loses that field to `undefined` — every
// key DEFAULT_SETTINGS knows about is guaranteed present after this runs. Never invents a *value*
// for something the person actually set; only fills in structural gaps with the same defaults a
// brand-new install would get.
function migrateSettings(loaded) {
  if (!loaded || typeof loaded !== "object" || Array.isArray(loaded)) {
    return { settings: DEFAULT_SETTINGS, issues: ["configurações salvas não eram um objeto válido — usando padrão"] };
  }
  const issues = [];
  const merged = { ...DEFAULT_SETTINGS, ...loaded };
  merged.platforms = { ...DEFAULT_SETTINGS.platforms, ...(loaded.platforms && typeof loaded.platforms === "object" ? loaded.platforms : {}) };
  merged.accountStatus = { ...DEFAULT_SETTINGS.accountStatus, ...(loaded.accountStatus && typeof loaded.accountStatus === "object" ? loaded.accountStatus : {}) };
  merged.subProgram = { ...DEFAULT_SETTINGS.subProgram, ...(loaded.subProgram && typeof loaded.subProgram === "object" ? loaded.subProgram : {}) };
  merged.customRevenueShare = { ...DEFAULT_SETTINGS.customRevenueShare, ...(loaded.customRevenueShare && typeof loaded.customRevenueShare === "object" ? loaded.customRevenueShare : {}) };
  merged.exchangeRates = (loaded.exchangeRates && typeof loaded.exchangeRates === "object" && !Array.isArray(loaded.exchangeRates)) ? loaded.exchangeRates : {};
  merged.rateMode = loaded.rateMode === "manual" ? "manual" : "auto";
  merged.exchangeRatesMeta = (loaded.exchangeRatesMeta && typeof loaded.exchangeRatesMeta === "object" && !Array.isArray(loaded.exchangeRatesMeta)) ? loaded.exchangeRatesMeta : { updatedAt: null, source: null };
  merged.rateHistory = (loaded.rateHistory && typeof loaded.rateHistory === "object" && !Array.isArray(loaded.rateHistory)) ? loaded.rateHistory : {};
  if (!validateCurrency(merged.currency)) { issues.push(`moeda salva "${loaded.currency}" é inválida — usando ${DEFAULT_SETTINGS.currency}`); merged.currency = DEFAULT_SETTINGS.currency; }
  if (!Number.isFinite(merged.taxReservePercent)) merged.taxReservePercent = DEFAULT_SETTINGS.taxReservePercent;
  if (!Number.isFinite(merged.taxReserveManual)) merged.taxReserveManual = DEFAULT_SETTINGS.taxReserveManual;
  merged.schemaVersion = SETTINGS_SCHEMA_VERSION;
  return { settings: merged, issues };
}

// Validates one session well enough to say "safe to include in financial totals" — does not try to
// fix meaningful content (e.g. a wrong date), only rejects structurally broken records. Returns
// { ok, session, reason } — never throws.
function validateSession(raw) {
  if (!raw || typeof raw !== "object" || Array.isArray(raw)) return { ok: false, reason: "não é um objeto" };
  if (!raw.id || typeof raw.id !== "string") return { ok: false, reason: "sem id válido" };
  if (!validatePlatform(raw.platform)) return { ok: false, reason: `plataforma "${raw.platform}" desconhecida` };
  if (typeof raw.date !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(raw.date)) return { ok: false, reason: "data inválida" };
  if (raw.mode !== "clock" && raw.mode !== "duration") return { ok: false, reason: "modo de duração inválido" };
  if (!Number.isFinite(raw.durationMin) || raw.durationMin < 0) return { ok: false, reason: "duração inválida" };
  if (raw.notes !== undefined && typeof raw.notes !== "string") return { ok: false, reason: "notas em formato inválido" };
  if (!raw.data || typeof raw.data !== "object" || Array.isArray(raw.data)) return { ok: false, reason: "dados da sessão ausentes ou inválidos" };
  // Sanitize (not reject) individual financial sub-fields: a corrupted single number inside `data`
  // doesn't need to invalidate the whole session — aggregateRevenue already isolates non-finite
  // amounts per entry — but we do normalize non-finite/negative numeric fields to a safe 0 here so
  // corrupted counts (e.g. "bits": "abc") can't silently become NaN deeper in the pipeline, and we
  // flag that it happened rather than pretending the data was always clean.
  const numericKeys = ["bits", "tier1", "tier2", "tier3", "giftCount", "primeCount", "subCount", "actualBitsRevenue", "actualSubsRevenue", "actualOtherRevenue", "actualRevenue", "amount"];
  let sanitizedFields = 0;
  const cleanData = { ...raw.data };
  numericKeys.forEach((k) => {
    if (k in cleanData && !Number.isFinite(cleanData[k])) { cleanData[k] = 0; sanitizedFields += 1; }
    if (k in cleanData && Number.isFinite(cleanData[k]) && cleanData[k] < 0) { cleanData[k] = 0; sanitizedFields += 1; }
  });
  return {
    ok: true,
    session: { ...raw, data: cleanData },
    sanitizedFields,
  };
}

// Accepts either the current wrapped format ({version, sessions}) or a legacy bare array (version 0,
// pre-dating this schema) and returns a fully validated, current-version result. Invalid records are
// never silently dropped without a trace — they're counted and returned separately so the caller can
// tell the person, and the original raw payload is preserved by the caller for a recovery backup.
function migrateSessions(loadedRaw) {
  let list;
  let fromVersion;
  if (Array.isArray(loadedRaw)) { list = loadedRaw; fromVersion = 0; }
  else if (loadedRaw && typeof loadedRaw === "object" && Array.isArray(loadedRaw.sessions)) { list = loadedRaw.sessions; fromVersion = Number.isFinite(loadedRaw.version) ? loadedRaw.version : 0; }
  else return { sessions: [], quarantined: [], fromVersion: null };

  const sessions = [];
  const quarantined = [];
  let sanitizedTotal = 0;
  list.forEach((raw, i) => {
    const result = validateSession(raw);
    if (result.ok) { sessions.push(result.session); sanitizedTotal += result.sanitizedFields || 0; }
    else quarantined.push({ index: i, reason: result.reason, raw });
  });
  return { sessions, quarantined, fromVersion, sanitizedTotal };
}

function fmt(amount, currency) {
  if (amount === null || amount === undefined || Number.isNaN(amount)) return "—";
  const sym = CURRENCY_SYMBOL[currency] || currency + " ";
  const noDecimals = currency === "JPY" || currency === "KRW";
  const rounded = noDecimals ? Math.round(amount) : Math.round(amount * 100) / 100;
  return `${sym}${rounded.toLocaleString("pt-BR", { minimumFractionDigits: noDecimals ? 0 : 2, maximumFractionDigits: noDecimals ? 0 : 2 })}`;
}

function convert(amount, from, to, rates) {
  if (from === to) return { value: amount, ok: true };
  const rate = rates[from];
  if (!Number.isFinite(rate) || rate <= 0) return { value: null, ok: false }; // treat missing, zero, negative, or corrupt rates identically as "cannot convert" — never silently multiply by a broken rate
  return { value: amount * rate, ok: true };
}

/* ------------------------------------------------------------------ */
/* Live currency conversion (Feature 12-19)                            */
/*                                                                       */
/* NIVA never hardcodes a rate like USD/JPY = 150. Instead it fetches a */
/* live, USD-based rate table and derives every pair NIVA needs from    */
/* it. Original amounts (e.g. Bits × US$0.01) are always calculated     */
/* first, in the platform's own currency — FX conversion is a separate  */
/* display-only step layered on top (see aggregateRevenue / convert).   */
/* ------------------------------------------------------------------ */

// Free, keyless FX feed — returns a full USD-based rate table in one call, so any pair (EUR->JPY,
// GBP->JPY, ...) can be cross-derived without one request per currency. Never throws: any failure
// (network, non-200, malformed body) comes back as { ok:false, error }, and callers must keep
// whatever rate was already stored rather than substituting a guessed/fixed one.
async function fetchLiveUsdRates() {
  try {
    const res = await fetch("https://open.er-api.com/v6/latest/USD");
    if (!res.ok) return { ok: false, error: `HTTP ${res.status}` };
    const json = await res.json();
    if (json.result !== "success" || !json.rates || typeof json.rates !== "object") {
      return { ok: false, error: "resposta inesperada da API de câmbio" };
    }
    return { ok: true, usdRates: json.rates, timestamp: new Date().toISOString() };
  } catch (e) {
    return { ok: false, error: e?.message || "falha de rede ao buscar a cotação" };
  }
}

// Cross-derives "1 <currency> = X <displayCurrency>" for every currency NIVA supports, from a
// single USD-based table. E.g. for displayCurrency=JPY: rate(EUR) = usdRates.JPY / usdRates.EUR.
// Returns null (not a partial/fake table) if the display currency itself is missing from the feed.
function deriveDisplayRates(usdRates, displayCurrency) {
  const displayPerUsd = displayCurrency === "USD" ? 1 : usdRates[displayCurrency];
  if (!Number.isFinite(displayPerUsd) || displayPerUsd <= 0) return null;
  const out = {};
  CURRENCIES.forEach((cur) => {
    if (cur === displayCurrency) return;
    if (cur === "USD") { out.USD = displayPerUsd; return; }
    const curPerUsd = usdRates[cur];
    if (Number.isFinite(curPerUsd) && curPerUsd > 0) out[cur] = displayPerUsd / curPerUsd;
  });
  return out;
}

// Resolves which rates apply to a given session date (Feature 18). Historical days keep the rate
// snapshot that was in effect on that day forever, even after today's rate moves — so a chart never
// silently repaints old Bits totals just because USD/JPY changed. `useTodayRate` is the escape
// hatch for "View in today's exchange rate" (Feature 18): when true, every date uses the current
// rate instead. A date with no snapshot of its own (e.g. NIVA wasn't open that day) falls back to
// the closest earlier snapshot rather than guessing with today's rate.
function makeRateResolver(settings, useTodayRate) {
  const current = settings.exchangeRates || {};
  if (useTodayRate) return () => current;
  const history = settings.rateHistory || {};
  const historyDates = Object.keys(history).sort();
  if (historyDates.length === 0) return () => current;
  return function ratesForDate(date) {
    if (history[date]) return history[date].rates;
    let candidate = null;
    for (const d of historyDates) { if (d <= date) candidate = d; else break; }
    return candidate ? history[candidate].rates : history[historyDates[0]].rates;
  };
}

// Policy (documented once, applied consistently everywhere duration is computed): a stream
// crossing midnight (20:00 -> 02:00) always resolves to the positive forward duration. Equal
// start/end times (20:00 -> 20:00) are treated as 0 minutes, not 24 hours — a same-time entry is
// far more likely to be an incomplete/mistaken form than an intentional full-day stream, and
// silently assuming 24h would inflate revenue-per-hour stats on bad data. Malformed input (empty,
// non-numeric, out-of-range) returns null so the caller can show "invalid" instead of a fake 0.
function minutesBetween(start, end) {
  if (!start || !end) return 0;
  const parts = /^(\d{1,2}):(\d{2})$/;
  const sMatch = parts.exec(start), eMatch = parts.exec(end);
  if (!sMatch || !eMatch) return null;
  const sh = Number(sMatch[1]), sm = Number(sMatch[2]), eh = Number(eMatch[1]), em = Number(eMatch[2]);
  if (sh > 23 || eh > 23 || sm > 59 || em > 59) return null;
  let mins = (eh * 60 + em) - (sh * 60 + sm);
  if (mins < 0) mins += 24 * 60;
  return mins;
}

function durationLabel(mins) {
  if (mins === null || mins === undefined || Number.isNaN(mins)) return "Horário inválido";
  if (!mins) return "0h 00m";
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return `${h}h ${String(m).padStart(2, "0")}m`;
}

function todayISO() {
  // Local calendar date, not UTC — toISOString() is UTC-based and silently shifts the date for
  // anyone east of UTC (e.g. Japan, UTC+9) during the hours right after local midnight. A creator
  // tracking "today" must get their own local day, not whatever day it currently is in London.
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function monthLabel(y, m) {
  return new Date(y, m, 1).toLocaleDateString("pt-BR", { month: "long", year: "numeric" });
}

/* ------------------------------------------------------------------ */
/* Revenue engine — never invents a number NIVA can't explain. Bits    */
/* creator revenue is auto-calculated (bits × US$0.01, a fixed system  */
/* constant — see BIT_VALUE_USD / RULES_META.bitsCreatorRevenue.       */
/* autoCalcRationale for why this is enabled despite the underlying    */
/* rule still being NEEDS_VERIFICATION) and always lands in ESTIMATED, */
/* never ACTUAL — a formula result is not the same thing as a person   */
/* confirming their real payout, and the two are never mixed into one  */
/* total. Everything else still requires manual entry.                 */
/* ------------------------------------------------------------------ */

function sessionRevenue(session, accountStatus) {
  const actual = [];
  const estimated = [];
  const needsManual = [];
  const d = session.data || {};

  if (session.platform === "twitch") {
    // Three non-overlapping revenue categories — each has its own ACTUAL field so a value
    // entered in one can never be double-counted with another. ACTUAL always wins over the
    // CALCULATED/ESTIMATED value for the same category — a person's confirmed real payout is
    // always trusted over NIVA's own formula, never added on top of it.
    if (d.actualBitsRevenue > 0) {
      actual.push({ amount: d.actualBitsRevenue, currency: d.actualBitsCurrency || "USD", label: "Bits (real)", category: "bits" });
    } else if (d.bits > 0) {
      estimated.push({ amount: d.bits * BIT_VALUE_USD, currency: "USD", label: `Bits (calculado — ${d.bits.toLocaleString("pt-BR")} × US$${BIT_VALUE_USD.toFixed(2)})`, category: "bits_estimated", note: "Regra de US$0,01/Bit fortemente corroborada por múltiplas fontes, mas não confirmada diretamente em página oficial da Twitch nesta sessão — veja Regras & Fontes." });
    }

    const subsTracked = (d.tier1 > 0) || (d.tier2 > 0) || (d.tier3 > 0) || (d.giftCount > 0) || (d.primeCount > 0) || (d.subCount > 0); // subCount = campo legado
    if (d.actualSubsRevenue > 0) {
      actual.push({ amount: d.actualSubsRevenue, currency: d.actualSubsCurrency || "USD", label: "Assinaturas (real)", category: "subs" });
    } else if (subsTracked) {
      needsManual.push("Assinaturas / Gift Subs / Prime Subs (contagem não determina receita — depende de região do espectador e programa de revenue share)");
    }

    if (d.actualOtherRevenue > 0) {
      actual.push({ amount: d.actualOtherRevenue, currency: d.actualOtherCurrency || "USD", label: "Outra receita Twitch (real)", category: "other" });
    }

    // Legacy sessions saved before the category split used one combined field. Preserved as-is
    // (never erased) but flagged, since NIVA can't retroactively know its category breakdown.
    if (d.actualRevenue > 0 && !d.actualBitsRevenue && !d.actualSubsRevenue && !d.actualOtherRevenue) {
      actual.push({ amount: d.actualRevenue, currency: d.actualCurrency || "USD", label: "Receita Twitch (real, valor combinado salvo antes da separação por categoria)", category: "legacy_combined" });
    }
  }

  if (session.platform === "kick") {
    if (d.actualRevenue > 0) {
      actual.push({ amount: d.actualRevenue, currency: d.actualCurrency || "USD", label: "Assinaturas e outros (real)" });
    } else {
      const subUnits = (d.subCount || 0) + (d.giftCount || 0);
      if (subUnits > 0) {
        const amount = subUnits * KICK_SUB_PRICE_USD * KICK_CREATOR_SHARE;
        estimated.push({
          amount,
          currency: "USD",
          label: `Assinaturas (calculado — ${subUnits.toLocaleString("pt-BR")} × US$${KICK_SUB_PRICE_USD.toFixed(2)} × 95%)`,
          category: "kick_subs_estimated",
          note: "Split 95/5 e preço de US$5/assinatura confirmados na página oficial da Kick. Se a Kick cobrar valor diferente na sua região, informe a receita real — ela sempre tem prioridade.",
        });
      }
    }
  }

  if (session.platform === "youtube") {
    if (d.amountType === "actual" && d.amount > 0) {
      actual.push({ amount: d.amount, currency: d.currency || "USD", label: "Super Chat / Stickers / Membros (real)" });
    } else if (d.amountType === "viewer" && d.amount > 0) {
      const amount = d.amount * YOUTUBE_FAN_FUNDING_SHARE;
      estimated.push({
        amount,
        currency: d.currency || "USD",
        label: `Super Chat / Stickers / Membros (calculado — ${d.amount.toFixed(2)} × 70%)`,
        category: "youtube_fanfunding_estimated",
        note: "70% é sobre receita líquida (após imposto local e taxas de loja) — o valor bruto do espectador foi usado como aproximação, então o valor real pode ser um pouco menor. Informe a receita real do YouTube Studio para o valor exato.",
      });
    }
  }

  return { actual, estimated, needsManual };
}

function aggregateRevenue(sessions, displayCurrency, ratesInput, accountStatus) {
  // ratesInput may be a flat { USD: 156.2, ... } object (legacy callers, or "today's rate" mode)
  // or a resolver function date => rates (historical mode, see makeRateResolver) — resolved once
  // per session below so every entry in that session converts using the rate for its own date.
  const resolveRates = typeof ratesInput === "function" ? ratesInput : () => (ratesInput || {});
  let actualTotal = 0, estimatedTotal = 0;
  let actualUnconverted = 0, estimatedUnconverted = 0;
  let corruptEntries = 0; // non-finite stored amounts (e.g. damaged saved data) — excluded from totals, never silently treated as 0, never allowed to turn the whole total into NaN
  const unconvertedByCurrency = {}; // { USD: 60 } — money NIVA knows exists but couldn't fold into the total (missing/invalid rate), so it's never silently dropped from what the person sees
  const perPlatform = { twitch: { actual: 0, estimated: 0, hours: 0, streams: 0, unconverted: 0 }, kick: { actual: 0, estimated: 0, hours: 0, streams: 0, unconverted: 0 }, youtube: { actual: 0, estimated: 0, hours: 0, streams: 0, unconverted: 0 } };
  let manualNeeded = 0;
  const breakdown = []; // transparency: every entry that contributed (or failed to convert), with original amount + rate used

  sessions.forEach((s) => {
    const rates = resolveRates(s.date);
    const rev = sessionRevenue(s, accountStatus);
    const p = perPlatform[s.platform];
    if (p) {
      p.hours += (s.durationMin || 0) / 60;
      p.streams += 1;
    }
    const handle = (e, targetTotalKey, targetPlatformKey) => {
      if (!Number.isFinite(e.amount)) {
        corruptEntries += 1;
        breakdown.push({ platform: s.platform, date: s.date, label: e.label, status: targetTotalKey, originalAmount: null, originalCurrency: e.currency, rate: null, convertedAmount: null, corrupt: true });
        return;
      }
      const c = convert(e.amount, e.currency, displayCurrency, rates);
      if (c.ok) {
        if (targetTotalKey === "actual") actualTotal += c.value; else estimatedTotal += c.value;
        if (p) p[targetPlatformKey] += c.value;
      } else {
        if (targetTotalKey === "actual") actualUnconverted += 1; else estimatedUnconverted += 1;
        if (p) p.unconverted += 1;
        unconvertedByCurrency[e.currency] = (unconvertedByCurrency[e.currency] || 0) + e.amount;
      }
      breakdown.push({ platform: s.platform, date: s.date, label: e.label, status: targetTotalKey, originalAmount: e.amount, originalCurrency: e.currency, rate: e.currency === displayCurrency ? 1 : rates[e.currency] || null, convertedAmount: c.ok ? c.value : null, note: e.note || null });
    };
    rev.actual.forEach((e) => handle(e, "actual", "actual"));
    rev.estimated.forEach((e) => handle(e, "estimated", "estimated"));
    manualNeeded += rev.needsManual.length;
  });

  return { actualTotal, estimatedTotal, actualUnconverted, estimatedUnconverted, corruptEntries, unconvertedByCurrency, perPlatform, manualNeeded, breakdown };
}

/* ------------------------------------------------------------------ */
/* Global date-range engine                                            */
/*                                                                       */
/* One shared range object drives Dashboard, Analytics, and the three   */
/* platform pages, so no page invents its own period logic. All dates   */
/* here are local-calendar ISO strings (see todayISO) — never UTC.      */
/* ------------------------------------------------------------------ */

const DATE_RANGE_OPTIONS = [
  { key: "today", label: "Hoje" },
  { key: "last7days", label: "Últimos 7 dias" },
  { key: "last30days", label: "Últimos 30 dias" },
  { key: "thisMonth", label: "Este mês" },
  { key: "lastMonth", label: "Mês passado" },
  { key: "thisYear", label: "Este ano" },
  { key: "allTime", label: "Todo o período" },
  { key: "custom", label: "Personalizado" },
];

function isoDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function addDaysISO(dateStr, days) {
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate() + days);
  return isoDate(d);
}

function daysBetweenISO(startISO, endISO) {
  const a = new Date(startISO + "T00:00:00");
  const b = new Date(endISO + "T00:00:00");
  return Math.round((b - a) / 86400000);
}

// Builds the central { type, startDate, endDate } range object every page reads. "allTime"
// resolves to the actual earliest/latest session date (never a hardcoded epoch), so a previous
// comparison or bucket size never assumes history that doesn't exist. "custom" trusts the caller
// to have already run validateCustomRange — it does not re-validate here.
function getDateRange(type, opts = {}) {
  const today = todayISO();
  switch (type) {
    case "today":
      return { type, startDate: today, endDate: today };
    case "last7days":
      return { type, startDate: addDaysISO(today, -6), endDate: today };
    case "last30days":
      return { type, startDate: addDaysISO(today, -29), endDate: today };
    case "thisMonth": {
      const d = new Date();
      return { type, startDate: isoDate(new Date(d.getFullYear(), d.getMonth(), 1)), endDate: today };
    }
    case "lastMonth": {
      const d = new Date();
      const start = new Date(d.getFullYear(), d.getMonth() - 1, 1);
      const end = new Date(d.getFullYear(), d.getMonth(), 0);
      return { type, startDate: isoDate(start), endDate: isoDate(end) };
    }
    case "thisYear": {
      const d = new Date();
      return { type, startDate: `${d.getFullYear()}-01-01`, endDate: today };
    }
    case "custom":
      return { type, startDate: opts.startDate, endDate: opts.endDate };
    case "allTime":
    default: {
      const sessions = opts.sessions || [];
      if (sessions.length === 0) return { type: "allTime", startDate: today, endDate: today };
      const dates = sessions.map((s) => s.date).sort();
      return { type: "allTime", startDate: dates[0], endDate: dates[dates.length - 1] };
    }
  }
}

// Blocks impossible custom ranges before they ever reach getDateRange: missing dates, unparsable
// dates, and start-after-end are all rejected here with a message meant to be shown to the person.
function validateCustomRange(startDate, endDate) {
  if (!startDate || !endDate) return { ok: false, reason: "Selecione a data inicial e a data final." };
  const s = new Date(startDate + "T00:00:00");
  const e = new Date(endDate + "T00:00:00");
  if (Number.isNaN(s.getTime()) || Number.isNaN(e.getTime())) return { ok: false, reason: "Data inválida." };
  if (s > e) return { ok: false, reason: "A data inicial não pode ser depois da data final." };
  return { ok: true };
}

function filterSessionsByDateRange(sessions, dateRange) {
  if (!dateRange || !dateRange.startDate || !dateRange.endDate) return sessions;
  return sessions.filter((s) => s.date >= dateRange.startDate && s.date <= dateRange.endDate);
}

// The immediately-preceding period of the same length, for period-over-period comparison.
// Returns null when "previous" doesn't mean anything — "allTime" has nothing before it, and a
// reversed/invalid range never produces a fabricated comparison window.
function getPreviousComparablePeriod(dateRange) {
  if (!dateRange || dateRange.type === "allTime" || !dateRange.startDate || !dateRange.endDate) return null;
  const lengthDays = daysBetweenISO(dateRange.startDate, dateRange.endDate) + 1;
  if (lengthDays <= 0) return null;
  const prevEnd = addDaysISO(dateRange.startDate, -1);
  const prevStart = addDaysISO(prevEnd, -(lengthDays - 1));
  return { type: "previous", startDate: prevStart, endDate: prevEnd };
}

/* ------------------------------------------------------------------ */
/* Analytics engine — pure functions, no React. Components only        */
/* receive the result of these and render it (Feature 11: heavy logic  */
/* stays out of components). Every function here is protected against  */
/* NaN/Infinity/empty input and never guesses a number NIVA can't see. */
/* ------------------------------------------------------------------ */

function calculateActivityMetrics(sessions) {
  const activeDays = new Set(sessions.map((s) => s.date)).size;
  return { streamCount: sessions.length, activeDays };
}

function calculateTimeMetrics(sessions) {
  const valid = sessions.filter((s) => Number.isFinite(s.durationMin) && s.durationMin >= 0);
  const totalMin = valid.reduce((a, s) => a + s.durationMin, 0);
  const avgMin = valid.length > 0 ? totalMin / valid.length : null;
  const longest = valid.length ? valid.reduce((a, s) => (s.durationMin > a.durationMin ? s : a)) : null;
  const shortest = valid.length ? valid.reduce((a, s) => (s.durationMin < a.durationMin ? s : a)) : null;
  return { totalMin, avgMin, longest, shortest, validCount: valid.length };
}

function calculatePlatformMetrics(sessions, displayCurrency, rates, accountStatus) {
  const result = {};
  PLATFORM_ORDER.forEach((k) => {
    const platSessions = sessions.filter((s) => s.platform === k);
    const agg = aggregateRevenue(platSessions, displayCurrency, rates, accountStatus);
    const hours = platSessions.reduce((a, s) => a + (s.durationMin || 0), 0) / 60;
    result[k] = { streams: platSessions.length, hours, actual: agg.actualTotal, estimated: agg.estimatedTotal, unconvertedByCurrency: agg.unconvertedByCurrency };
  });
  return result;
}

// Revenue-per-hour is deliberately based on REAL (actual) revenue only, never estimated — mixing
// an estimate into a per-hour rate would present a guess as a measured rate. Null (not 0) when
// there isn't enough data, so callers show "Dados insuficientes" instead of a fake ¥0/h.
function calculateRevenueMetrics(sessions, displayCurrency, rates, accountStatus) {
  const agg = aggregateRevenue(sessions, displayCurrency, rates, accountStatus);
  const hours = sessions.reduce((a, s) => a + (s.durationMin || 0), 0) / 60;
  const revPerHourReal = (hours > 0 && agg.actualTotal > 0) ? agg.actualTotal / hours : null;
  return { ...agg, hours, revPerHourReal };
}

// Longest run of consecutive calendar days containing at least one stream. A day with zero
// streams always breaks the streak — there is no "grace day".
function calculateStreamingStreak(sessions) {
  const days = [...new Set(sessions.map((s) => s.date))].sort();
  if (days.length === 0) return 0;
  let longest = 1, current = 1;
  for (let i = 1; i < days.length; i++) {
    current = daysBetweenISO(days[i - 1], days[i]) === 1 ? current + 1 : 1;
    longest = Math.max(longest, current);
  }
  return longest;
}

// Never returns Infinity/NaN: a zero or non-finite previous value means "no meaningful percentage
// exists", reported as null so the UI can say "Sem dados para comparação" instead of "+∞%".
function percentChange(current, previous) {
  if (!Number.isFinite(current) || !Number.isFinite(previous) || previous === 0) return null;
  const pct = ((current - previous) / Math.abs(previous)) * 100;
  return Number.isFinite(pct) ? pct : null;
}

// Returns null when the previous period has no sessions at all — "0 vs 0" is not a comparison
// worth showing, and "something vs 0" would only ever produce the +∞% this app refuses to show.
function calculateComparisonMetrics(currentSessions, previousSessions, displayCurrency, rates, accountStatus) {
  if (!previousSessions || previousSessions.length === 0) return null;
  const curHours = currentSessions.reduce((a, s) => a + (s.durationMin || 0), 0) / 60;
  const prevHours = previousSessions.reduce((a, s) => a + (s.durationMin || 0), 0) / 60;
  const curAgg = aggregateRevenue(currentSessions, displayCurrency, rates, accountStatus);
  const prevAgg = aggregateRevenue(previousSessions, displayCurrency, rates, accountStatus);
  const curActiveDays = new Set(currentSessions.map((s) => s.date)).size;
  const prevActiveDays = new Set(previousSessions.map((s) => s.date)).size;
  const curPerHour = curHours > 0 && curAgg.actualTotal > 0 ? curAgg.actualTotal / curHours : null;
  const prevPerHour = prevHours > 0 && prevAgg.actualTotal > 0 ? prevAgg.actualTotal / prevHours : null;
  return {
    hours: { current: curHours, previous: prevHours, pct: percentChange(curHours, prevHours) },
    streams: { current: currentSessions.length, previous: previousSessions.length, pct: percentChange(currentSessions.length, previousSessions.length) },
    activeDays: { current: curActiveDays, previous: prevActiveDays, pct: percentChange(curActiveDays, prevActiveDays) },
    revenueActual: { current: curAgg.actualTotal, previous: prevAgg.actualTotal, pct: percentChange(curAgg.actualTotal, prevAgg.actualTotal) },
    revenuePerHour: (curPerHour !== null && prevPerHour !== null) ? { current: curPerHour, previous: prevPerHour, pct: percentChange(curPerHour, prevPerHour) } : null,
  };
}

// Chooses a bucket granularity (day/week/month) from the selected range's length so charts stay
// legible whether the person picked "Hoje" or "Todo o período", then groups sessions by bucket.
function bucketGranularity(dateRange) {
  if (!dateRange || !dateRange.startDate || !dateRange.endDate) return "day";
  const lengthDays = daysBetweenISO(dateRange.startDate, dateRange.endDate) + 1;
  if (lengthDays <= 45) return "day";
  if (lengthDays <= 210) return "week";
  return "month";
}

function bucketKeyForDate(dateStr, granularity) {
  const d = new Date(dateStr + "T00:00:00");
  if (granularity === "day") return dateStr;
  if (granularity === "month") return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
  // ISO-ish week bucket: year + week-of-year (Sunday-start), stable enough for chart grouping —
  // not used for anything financial, so exact ISO-8601 week numbering isn't required.
  const jan1 = new Date(d.getFullYear(), 0, 1);
  const week = Math.ceil(((d - jan1) / 86400000 + jan1.getDay() + 1) / 7);
  return `${d.getFullYear()}-S${String(week).padStart(2, "0")}`;
}

function bucketSessions(sessions, dateRange) {
  const granularity = bucketGranularity(dateRange);
  const buckets = {};
  sessions.forEach((s) => {
    const key = bucketKeyForDate(s.date, granularity);
    if (!buckets[key]) buckets[key] = { hours: 0, streams: 0 };
    buckets[key].hours += (s.durationMin || 0) / 60;
    buckets[key].streams += 1;
  });
  return { granularity, buckets };
}

// Insights are generated only from metrics already computed elsewhere in this file — never a new
// guess. Below a small data floor, NIVA says so instead of manufacturing something from noise.
function generateInsights({ sessions, activityMetrics, platformMetrics, comparison, streak }) {
  if (sessions.length < 3) return { insights: [], fallback: "Continue registrando suas streams para receber insights." };
  const insights = [];

  if (activityMetrics.activeDays > 0) {
    insights.push({ icon: "🔥", text: `Você transmitiu em ${activityMetrics.activeDays} dia${activityMetrics.activeDays === 1 ? "" : "s"} neste período.` });
  }
  if (streak >= 2) {
    insights.push({ icon: "🔥", text: `Sua maior sequência foi de ${streak} dias consecutivos.` });
  }
  if (comparison && comparison.hours.pct !== null && Math.abs(comparison.hours.pct) >= 5) {
    const dir = comparison.hours.pct >= 0 ? "mais" : "menos";
    insights.push({ icon: "📈", text: `Você transmitiu ${Math.abs(comparison.hours.pct).toFixed(0)}% ${dir} horas que no período anterior.` });
  }
  const platformHours = PLATFORM_ORDER.map((k) => ({ k, hours: platformMetrics[k].hours })).filter((p) => p.hours > 0);
  const totalHours = platformHours.reduce((a, p) => a + p.hours, 0);
  if (platformHours.length > 0 && totalHours > 0) {
    const top = platformHours.sort((a, b) => b.hours - a.hours)[0];
    const pct = (top.hours / totalHours) * 100;
    if (pct >= 40) insights.push({ icon: "🎮", text: `${PLATFORMS[top.k].label} representou ${pct.toFixed(0)}% do seu tempo de streaming.` });
  }
  if (comparison && comparison.revenuePerHour && comparison.revenuePerHour.pct !== null && Math.abs(comparison.revenuePerHour.pct) >= 5) {
    const dir = comparison.revenuePerHour.pct >= 0 ? "aumentou" : "diminuiu";
    insights.push({ icon: "💰", text: `Sua receita real por hora ${dir} ${Math.abs(comparison.revenuePerHour.pct).toFixed(0)}%.` });
  }

  if (insights.length === 0) return { insights: [], fallback: "Continue registrando suas streams para receber insights." };
  return { insights, fallback: null };
}

function DateRangeFilter({ dateRange, onChangeType, onChangeCustom }) {

}

// Renders one comparison delta ("↑ 18% vs período anterior"). Renders the "no data" fallback
// instead of a percentage whenever the underlying metric is null — see percentChange /
// calculateComparisonMetrics, which never produce Infinity or NaN in the first place.
function ComparisonDelta({ metric }) {
  if (!metric || metric.pct === null) {
    return <span style={{ fontSize: 11.5, color: "var(--muted)" }}>Sem dados para comparação</span>;
  }
  const positive = metric.pct >= 0;
  const Icon = positive ? TrendingUp : TrendingDown;
  return (
    <span style={{ fontSize: 11.5, display: "inline-flex", alignItems: "center", gap: 4 }}>

      <span style={{ color: "var(--muted)" }}>vs período anterior</span>
    </span>
  );
}

          <div style={{ flex: 1 }}>
            <label className="niva-label">Fim</label>
            <input type="time" className="niva-input" value={end} onChange={(e) => setEnd(e.target.value)} />
          </div>
        </div>
      ) : (
        <div style={{ marginBottom: 14 }}>
          <label className="niva-label">Duração (minutos)</label>
          <input type="number" min="0" className="niva-input" value={durationMin} onChange={(e) => setDurationMin(e.target.value)} />
        </div>
      )}
      <div style={{ fontSize: 12.5, color: durationInvalid ? "#E8917A" : "var(--muted)", marginBottom: 6, display: "flex", alignItems: "center", gap: 6 }}>
        <Clock size={13} /> Total: {durationLabel(computedDuration)}
      </div>
      {durationInvalid && (
        <div className="niva-hint warn" style={{ marginBottom: 12 }}><AlertTriangle size={13} /> Horário inválido — confira o início e o fim.</div>
      )}
      {!durationInvalid && computedDuration === 0 && (
        <div className="niva-hint warn" style={{ marginBottom: 12 }}><AlertTriangle size={13} /> Duração zero (início e fim iguais são tratados como 0h, não 24h) — confira se é isso mesmo.</div>
      )}

      {platform === "twitch" && (
        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>

          {/* ---------------------------------------------------------- */}
          {/* 📊 ATIVIDADE — quantidade, nunca dinheiro                   */}
          {/* ---------------------------------------------------------- */}
          <div style={{ border: "1px solid var(--border)", borderRadius: 12, padding: 14, background: "rgba(255,255,255,0.015)" }}>
            <div style={{ display: "flex", alignItems: "baseline", gap: 8, marginBottom: 12 }}>
              <span style={{ fontFamily: "var(--font-display)", fontSize: 14 }}>📊 Atividade</span>
              <span style={{ fontSize: 11.5, color: "var(--muted)" }}>quantidade — não é dinheiro recebido</span>
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
              <div>
                <label className="niva-label">Bits recebidos</label>
                <IntInput value={data.bits} onChange={(v) => set("bits", v)} />
                {data.bits > 0 && (
                  <div className="niva-hint">
                    <Info size={13} /> Calculado automaticamente: {data.bits.toLocaleString("pt-BR")} × US$0,01 = US${(data.bits * BIT_VALUE_USD).toFixed(2)}
                    {settings?.currency && settings.currency !== "USD" && Number.isFinite(settings.exchangeRates?.USD) && (
                      <> ≈ {fmt(data.bits * BIT_VALUE_USD * settings.exchangeRates.USD, settings.currency)}</>
                    )}
                    {" "}— entra como receita 🟡 estimada, nunca somada à real. Se você já sabe o valor real recebido, informe abaixo (ele sempre tem prioridade).
                  </div>
                )}
              </div>
              <div style={{ display: "flex", gap: 10 }}>
                <div style={{ flex: 1 }}>
                  <label className="niva-label">Tier 1</label>
                  <IntInput value={data.tier1} onChange={(v) => set("tier1", v)} />
                </div>
                <div style={{ flex: 1 }}>
                  <label className="niva-label">Tier 2</label>
                  <IntInput value={data.tier2} onChange={(v) => set("tier2", v)} />
                </div>
                <div style={{ flex: 1 }}>
                  <label className="niva-label">Tier 3</label>
                  <IntInput value={data.tier3} onChange={(v) => set("tier3", v)} />
                </div>
              </div>
              <div style={{ display: "flex", gap: 10 }}>
                <div style={{ flex: 1 }}>
                  <label className="niva-label">Gift subs</label>
                  <IntInput value={data.giftCount} onChange={(v) => set("giftCount", v)} />
                </div>
                <div style={{ flex: 1 }}>
                  <label className="niva-label">Prime subs</label>
                  <IntInput value={data.primeCount} onChange={(v) => set("primeCount", v)} />
                </div>
              </div>
            </div>
          </div>

          {/* ---------------------------------------------------------- */}
          {/* 💰 RECEITA CONFIRMADA — dinheiro realmente confirmado       */}
          {/* ---------------------------------------------------------- */}
          <div style={{ border: "1px solid rgba(201,161,90,0.35)", borderRadius: 12, padding: 14, background: "rgba(201,161,90,0.05)" }}>
            <div style={{ display: "flex", alignItems: "baseline", gap: 8, marginBottom: 12 }}>
              <span style={{ fontFamily: "var(--font-display)", fontSize: 14, color: "var(--gold)" }}>💰 Receita Confirmada</span>
              <span style={{ fontSize: 11.5, color: "var(--muted)" }}>dinheiro realmente confirmado</span>
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
              <div>
                <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 6 }}>
                  <label className="niva-label" style={{ marginBottom: 0 }}>Receita real — Bits</label>
                  <InfoTip
                    label="Como preencher?"
                    width={290}
                    align="right"
                    text={
                      <>
                        Opcional — só preencha se você já sabe o valor real e confirmado recebido pelos Bits (ex.: no relatório financeiro da Twitch). Esse valor sempre tem prioridade sobre o cálculo automático.
                        <br /><br />
                        Não informe a quantidade de Bits recebidos neste campo — isso é uma métrica de atividade, não dinheiro.
                        <br /><br />
                        Se deixar em branco, o NIVA usa {`bits × US$${BIT_VALUE_USD.toFixed(2)}`} automaticamente como receita estimada (🟡).
                      </>
                    }
                  />
                </div>
                <div style={{ display: "flex", gap: 10 }}>
                  <div style={{ flex: 2 }}>
                    <input type="number" min="0" step="0.01" className="niva-input" value={data.actualBitsRevenue} onChange={(e) => set("actualBitsRevenue", safeNum(e.target.value))} />
                  </div>
                  <div style={{ flex: 1 }}>
                    <select className="niva-input" value={data.actualBitsCurrency} onChange={(e) => set("actualBitsCurrency", e.target.value)}>
                      {CURRENCIES.map((c) => <option key={c}>{c}</option>)}
                    </select>
                  </div>
                </div>
                {data.bits > 0 && !data.actualBitsRevenue ? (
                  <div className="niva-hint">💡 Calculado automaticamente: {data.bits.toLocaleString("pt-BR")} × US$0,01 = US${(data.bits * BIT_VALUE_USD).toFixed(2)} (🟡 estimado — veja Regras & Fontes). Informe o valor real acima se souber o valor exato.</div>
                ) : null}
              </div>

              <div>
                <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 6 }}>
                  <label className="niva-label" style={{ marginBottom: 0 }}>Receita real — Assinaturas</label>
                  <InfoTip
                    label="Como preencher?"
                    width={300}
                    align="right"
                    text={
                      <>
                        Informe o valor financeiro real e confirmado recebido pelas assinaturas. Este valor pode incluir Tier 1, Tier 2, Tier 3, Gift Subs e Prime.
                        <br /><br />
                        Não utilize automaticamente o preço pago pelo espectador como receita do streamer. O valor efetivamente recebido pode ser diferente devido a acordos, divisão de receita, localização, impostos ou outras regras da plataforma.
                      </>
                    }
                  />
                </div>
                <div style={{ display: "flex", gap: 10 }}>
                  <div style={{ flex: 2 }}>
                    <input type="number" min="0" step="0.01" className="niva-input" value={data.actualSubsRevenue} onChange={(e) => set("actualSubsRevenue", safeNum(e.target.value))} />
                  </div>
                  <div style={{ flex: 1 }}>
                    <select className="niva-input" value={data.actualSubsCurrency} onChange={(e) => set("actualSubsCurrency", e.target.value)}>
                      {CURRENCIES.map((c) => <option key={c}>{c}</option>)}
                    </select>
                  </div>
                </div>
                {(data.tier1 > 0 || data.tier2 > 0 || data.tier3 > 0 || data.giftCount > 0 || data.primeCount > 0) && !data.actualSubsRevenue ? (
                  <div className="niva-hint warn"><AlertTriangle size={13} /> A contagem de assinaturas não determina a receita exata (varia por região do espectador e programa de revenue share). Informe só a parte de assinaturas aqui — não misture com Bits.</div>
                ) : null}
                <div className="niva-hint">O NIVA não calcula automaticamente a receita das assinaturas usando o preço da assinatura. Para manter os dados confiáveis, registre apenas valores reais ou confirmados.</div>
              </div>

              <div>
                <label className="niva-label">Outra receita Twitch (real)</label>
                <div style={{ display: "flex", gap: 10 }}>
                  <div style={{ flex: 2 }}>
                    <input type="number" min="0" step="0.01" className="niva-input" value={data.actualOtherRevenue} onChange={(e) => set("actualOtherRevenue", safeNum(e.target.value))} />
                  </div>
                  <div style={{ flex: 1 }}>
                    <select className="niva-input" value={data.actualOtherCurrency} onChange={(e) => set("actualOtherCurrency", e.target.value)}>
                      {CURRENCIES.map((c) => <option key={c}>{c}</option>)}
                    </select>
                  </div>
                </div>
                <div className="niva-hint">Não repita aqui valores já informados em Bits ou Assinaturas acima.</div>
              </div>
            </div>
          </div>
        </div>
      )}

      {platform === "kick" && (
        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          <div style={{ display: "flex", gap: 10 }}>
            <div style={{ flex: 1 }}>
              <label className="niva-label">Nº de assinaturas</label>
              <IntInput value={data.subCount} onChange={(v) => set("subCount", v)} />
            </div>
            <div style={{ flex: 1 }}>
              <label className="niva-label">Gift subs</label>
              <IntInput value={data.giftCount} onChange={(v) => set("giftCount", v)} />
            </div>
          </div>
          <div style={{ display: "flex", gap: 10 }}>
            <div style={{ flex: 2 }}>
              <label className="niva-label">Receita real (painel da Kick)</label>
              <input type="number" min="0" step="0.01" className="niva-input" value={data.actualRevenue} onChange={(e) => set("actualRevenue", safeNum(e.target.value))} />
            </div>
            <div style={{ flex: 1 }}>
              <label className="niva-label">Moeda</label>
              <select className="niva-input" value={data.actualCurrency} onChange={(e) => set("actualCurrency", e.target.value)}>
                {CURRENCIES.map((c) => <option key={c}>{c}</option>)}
              </select>
            </div>
          </div>
          {(data.subCount > 0 || data.giftCount > 0) && !data.actualRevenue ? (
            <div className="niva-hint">💡 Calculado automaticamente: {(data.subCount + data.giftCount).toLocaleString("pt-BR")} × US$5,00 × 95% = US${((data.subCount + data.giftCount) * KICK_SUB_PRICE_USD * KICK_CREATOR_SHARE).toFixed(2)} (🟡 estimado — split e preço oficiais da Kick). Informe o valor real acima se souber o valor exato.</div>
          ) : null}
        </div>
      )}

      {platform === "youtube" && (
        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          <label className="niva-label">Tipo de valor informado</label>
          <div style={{ display: "flex", gap: 10 }}>
            <button className="niva-chip" onClick={() => set("amountType", "actual")} style={{ borderColor: data.amountType === "actual" ? PLATFORMS.youtube.accent : "var(--border)", color: data.amountType === "actual" ? PLATFORMS.youtube.accent : "var(--muted)" }}>Receita real (painel do YouTube)</button>
            <button className="niva-chip" onClick={() => set("amountType", "viewer")} style={{ borderColor: data.amountType === "viewer" ? PLATFORMS.youtube.accent : "var(--border)", color: data.amountType === "viewer" ? PLATFORMS.youtube.accent : "var(--muted)" }}>Valor bruto pago pelo espectador</button>
          </div>
          <div style={{ display: "flex", gap: 10 }}>
            <div style={{ flex: 2 }}>
              <label className="niva-label">Valor (Super Chat / Stickers / Membros)</label>
              <input type="number" min="0" step="0.01" className="niva-input" value={data.amount} onChange={(e) => set("amount", safeNum(e.target.value))} />
            </div>
            <div style={{ flex: 1 }}>
              <label className="niva-label">Moeda</label>
              <select className="niva-input" value={data.currency} onChange={(e) => set("currency", e.target.value)}>
                {CURRENCIES.map((c) => <option key={c}>{c}</option>)}
              </select>
            </div>
          </div>
          {data.amountType === "viewer" && data.amount > 0 ? (
            <div className="niva-hint">💡 Calculado automaticamente: {data.amount.toFixed(2)} × 70% = {(data.amount * YOUTUBE_FAN_FUNDING_SHARE).toFixed(2)} {data.currency} (🟡 estimado — split oficial do YouTube, mas sobre receita líquida; o valor bruto foi usado como aproximação). Informe a receita real do YouTube Studio se souber o valor exato.</div>
          ) : null}
        </div>
      )}

      <div>
        <label className="niva-label" style={{ marginTop: 14 }}>Notas (opcional)</label>
        <input className="niva-input" value={notes} onChange={(e) => setNotes(e.target.value)} placeholder="Ex: colab, evento especial..." />
      </div>

      <div style={{ display: "flex", justifyContent: "flex-end", gap: 10, marginTop: 18 }}>
        <button className="niva-btn ghost" onClick={onCancel}>Cancelar</button>
        <button className="niva-btn primary" onClick={submit} disabled={durationInvalid} style={{ opacity: durationInvalid ? 0.5 : 1, cursor: durationInvalid ? "not-allowed" : "pointer" }}><Check size={14} /> Salvar sessão</button>
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* Day panel                                                           */
/* ------------------------------------------------------------------ */

function DayPanel({ date, sessions, activePlatforms, settings, onClose, onSave, onDelete }) {
  const [adding, setAdding] = useState(sessions.length === 0);
  const [editingId, setEditingId] = useState(null);

  const daySessions = sessions;
  const dateObj = new Date(date + "T00:00:00");

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(10,11,13,0.72)", display: "flex", justifyContent: "flex-end", zIndex: 90 }} onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div style={{ width: 480, maxWidth: "100%", height: "100%", background: "var(--panel)", borderLeft: "1px solid var(--border)", overflowY: "auto", padding: 24 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 20 }}>
          <div>
            <div style={{ fontSize: 12.5, color: "var(--muted)", textTransform: "capitalize" }}>{dateObj.toLocaleDateString("pt-BR", { weekday: "long" })}</div>
            <div style={{ fontFamily: "var(--font-display)", fontSize: 24 }}>{dateObj.toLocaleDateString("pt-BR", { day: "2-digit", month: "long", year: "numeric" })}</div>
          </div>
          <button className="niva-icon-btn" onClick={onClose}><X size={18} /></button>
        </div>

        {daySessions.length === 0 && !adding && (
          <EmptyState title="Nenhuma sessão neste dia" body="Adicione uma sessão de stream para começar a acompanhar horas e receita." />
        )}

        <div style={{ display: "flex", flexDirection: "column", gap: 12, marginBottom: 16 }}>
          {daySessions.map((s) => {
            if (editingId === s.id) {
              return (
                <SessionForm
                  key={s.id}
                  date={date}
                  activePlatforms={activePlatforms}
                  initial={s}
                  settings={settings}
                  onCancel={() => setEditingId(null)}
                  onSave={(sess) => { onSave(sess); setEditingId(null); }}
                  onDelete={(id) => { onDelete(id); setEditingId(null); }}
                />
              );
            }
            const rev = sessionRevenue(s, settings.accountStatus);
            return (
              <Card key={s.id} style={{ padding: 16, borderLeft: `3px solid ${PLATFORMS[s.platform].accent}` }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <PlatformTag platform={s.platform} />
                  <div style={{ display: "flex", gap: 6 }}>
                    <button className="niva-icon-btn" onClick={() => setEditingId(s.id)}><Pencil size={14} /></button>
                    <button className="niva-icon-btn" onClick={() => onDelete(s.id)}><Trash2 size={14} /></button>
                  </div>
                </div>
                <div style={{ fontSize: 13, color: "var(--muted)", margin: "6px 0" }}>
                  {s.mode === "clock" ? `${s.start} → ${s.end}` : "Duração manual"} · {durationLabel(s.durationMin)}
                </div>
                <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                  {rev.actual.map((e, i) => <StatusPill key={"a" + i} status="actual" />)}
                  {rev.estimated.map((e, i) => <StatusPill key={"e" + i} status="estimated" />)}
                  {rev.needsManual.map((label, i) => <StatusPill key={"m" + i} status="manual" />)}
                  {rev.actual.length === 0 && rev.estimated.length === 0 && rev.needsManual.length === 0 && (
                    <span style={{ fontSize: 12.5, color: "var(--muted)" }}>Sem dados de monetização</span>
                  )}
                </div>
                {s.notes && <div style={{ fontSize: 12.5, color: "var(--muted)", marginTop: 8, fontStyle: "italic" }}>{s.notes}</div>}
              </Card>
            );
          })}
        </div>

        {adding ? (
          <SessionForm
            date={date}
            activePlatforms={activePlatforms}
            settings={settings}
            onCancel={() => setAdding(false)}
            onSave={(sess) => { onSave(sess); setAdding(false); }}
          />
        ) : (
          <button className="niva-btn primary" style={{ width: "100%", justifyContent: "center" }} onClick={() => setAdding(true)}>
            <Plus size={15} /> Adicionar sessão de stream
          </button>
        )}
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* Quick Add Stream (Feature 2)                                        */
/*                                                                       */
/* Deliberately asks for nothing but platform, date, and duration — no  */
/* revenue field exists here at all, so there is no way to "quick add"  */
/* a guessed number into the financial totals. Revenue is always added  */
/* afterwards through the normal SessionForm (in DayPanel), either      */
/* right away ("Adicionar receita agora") or later by editing the day.  */
/* ------------------------------------------------------------------ */

function QuickAddStream({ activePlatforms, onSaved, onClose }) {
  const firstPlatform = activePlatforms[0] || "twitch";
  const [platform, setPlatform] = useState(firstPlatform);
  const [date, setDate] = useState(todayISO());
  const [mode, setMode] = useState("clock");
  const [start, setStart] = useState("20:00");
  const [end, setEnd] = useState("23:00");
  const [durationMin, setDurationMin] = useState(180);
  const [notes, setNotes] = useState("");
  const [saved, setSaved] = useState(null);

  const computedDuration = mode === "clock" ? minutesBetween(start, end) : safeNum(durationMin, { min: 0 });
  const durationInvalid = computedDuration === null;

  const handleSave = () => {
    if (durationInvalid) return;
    const session = {
      id: uid(),
      platform,
      date,
      mode,
      start: mode === "clock" ? start : null,
      end: mode === "clock" ? end : null,
      durationMin: computedDuration,
      notes,
      data: emptyPlatformData(platform),
    };
    onSaved(session);
    setSaved(session);
  };

  if (saved) {
    return (
      <div style={MODAL_OVERLAY_STYLE} onClick={(e) => { if (e.target === e.currentTarget) onClose(null); }}>
        <div className="niva-card" style={{ width: 380, maxWidth: "100%", padding: 28, textAlign: "center" }}>
          <div style={{ display: "inline-flex", width: 42, height: 42, borderRadius: 999, background: "rgba(90,200,140,0.14)", alignItems: "center", justifyContent: "center", marginBottom: 14 }}>
            <Check size={20} style={{ color: "#7BE0A8" }} />
          </div>
          <div style={{ fontFamily: "var(--font-display)", fontSize: 20, marginBottom: 6 }}>Stream registrada</div>
          <div style={{ fontSize: 13, color: "var(--muted)", marginBottom: 22 }}><PlatformTag platform={saved.platform} /> · {durationLabel(saved.durationMin)}</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            <button className="niva-btn primary" style={{ justifyContent: "center" }} onClick={() => onClose(saved.date)}>Adicionar receita agora</button>
            <button className="niva-btn ghost" style={{ justifyContent: "center" }} onClick={() => onClose(null)}>Concluir</button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div style={MODAL_OVERLAY_STYLE} onClick={(e) => { if (e.target === e.currentTarget) onClose(null); }}>
      <div className="niva-card" style={{ width: 420, maxWidth: "100%", padding: 24, maxHeight: "90vh", overflowY: "auto" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 18 }}>
          <div style={{ fontFamily: "var(--font-display)", fontSize: 20 }}>➕ Registrar Stream</div>
          <button className="niva-icon-btn" onClick={() => onClose(null)}><X size={16} /></button>
        </div>

        <label className="niva-label">Plataforma</label>
        <div style={{ display: "flex", gap: 8, marginBottom: 16, flexWrap: "wrap" }}>
          {activePlatforms.map((k) => (
            <button key={k} onClick={() => setPlatform(k)} className="niva-chip" style={{ borderColor: platform === k ? PLATFORMS[k].accent : "var(--border)", background: platform === k ? PLATFORMS[k].accentSoft : "transparent", color: platform === k ? PLATFORMS[k].accent : "var(--muted)" }}>
              {PLATFORMS[k].label}
            </button>
          ))}
        </div>

        <label className="niva-label">Data</label>
        <input type="date" className="niva-input" style={{ marginBottom: 16 }} value={date} onChange={(e) => setDate(e.target.value)} />

        <div style={{ display: "flex", gap: 10, marginBottom: 12 }}>
          <button className="niva-chip" onClick={() => setMode("clock")} style={{ borderColor: mode === "clock" ? "var(--gold)" : "var(--border)", color: mode === "clock" ? "var(--gold)" : "var(--muted)" }}>Horário</button>
          <button className="niva-chip" onClick={() => setMode("duration")} style={{ borderColor: mode === "duration" ? "var(--gold)" : "var(--border)", color: mode === "duration" ? "var(--gold)" : "var(--muted)" }}>Duração</button>
        </div>

        {mode === "clock" ? (
          <div style={{ display: "flex", gap: 10, marginBottom: 8 }}>
            <div style={{ flex: 1 }}>
              <label className="niva-label">Início</label>
              <input type="time" className="niva-input" value={start} onChange={(e) => setStart(e.target.value)} />
            </div>
            <div style={{ flex: 1 }}>
              <label className="niva-label">Fim</label>
              <input type="time" className="niva-input" value={end} onChange={(e) => setEnd(e.target.value)} />
            </div>
          </div>
        ) : (
          <div style={{ marginBottom: 8 }}>
            <label className="niva-label">Duração (minutos)</label>
            <input type="number" min="0" className="niva-input" value={durationMin} onChange={(e) => setDurationMin(e.target.value)} />
          </div>
        )}
        <div style={{ fontSize: 12.5, color: durationInvalid ? "#E8917A" : "var(--muted)", marginBottom: 16, display: "flex", alignItems: "center", gap: 6 }}>
          <Clock size={13} /> Total: {durationLabel(computedDuration)}
        </div>
        {durationInvalid && (
          <div className="niva-hint warn" style={{ marginBottom: 12 }}><AlertTriangle size={13} /> Horário inválido — confira o início e o fim.</div>
        )}

        <label className="niva-label">Notas (opcional)</label>
        <input className="niva-input" style={{ marginBottom: 20 }} placeholder="Ex: colab, evento especial..." value={notes} onChange={(e) => setNotes(e.target.value)} />

        <button className="niva-btn primary" style={{ width: "100%", justifyContent: "center" }} disabled={durationInvalid} onClick={handleSave}>Salvar</button>
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* Calendar                                                             */
/* ------------------------------------------------------------------ */

function CalendarView({ sessions, activePlatforms, onOpenDay }) {
  const [cursor, setCursor] = useState(() => { const d = new Date(); return { y: d.getFullYear(), m: d.getMonth() }; });
  const first = new Date(cursor.y, cursor.m, 1);
  const startWeekday = first.getDay();
  const daysInMonth = new Date(cursor.y, cursor.m + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < startWeekday; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);

  const byDate = useMemo(() => {
    const map = {};
    sessions.forEach((s) => { (map[s.date] = map[s.date] || []).push(s); });
    return map;
  }, [sessions]);

  const weekdayLabels = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];

  return (
    <Card style={{ padding: 20 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 18 }}>
        <div style={{ fontFamily: "var(--font-display)", fontSize: 22, textTransform: "capitalize" }}>{monthLabel(cursor.y, cursor.m)}</div>
        <div style={{ display: "flex", gap: 6 }}>
          <button className="niva-icon-btn" onClick={() => setCursor((c) => c.m === 0 ? { y: c.y - 1, m: 11 } : { y: c.y, m: c.m - 1 })}><ChevronLeft size={16} /></button>
          <button className="niva-icon-btn" onClick={() => setCursor((c) => c.m === 11 ? { y: c.y + 1, m: 0 } : { y: c.y, m: c.m + 1 })}><ChevronRight size={16} /></button>
        </div>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", gap: 6, marginBottom: 6 }}>
        {weekdayLabels.map((w) => <div key={w} style={{ fontSize: 11.5, color: "var(--muted)", textAlign: "center", fontWeight: 600 }}>{w}</div>)}
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", gap: 6 }}>
        {cells.map((d, i) => {
          if (d === null) return <div key={i} />;
          const dateStr = `${cursor.y}-${String(cursor.m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
          const daySessions = byDate[dateStr] || [];
          const isToday = dateStr === todayISO();
          const platformsUsed = [...new Set(daySessions.map((s) => s.platform))];
          return (
            <button key={i} onClick={() => onOpenDay(dateStr)} className="niva-daycell" style={{ borderColor: isToday ? "var(--gold)" : "var(--border)" }}>
              <div style={{ fontSize: 12.5, color: isToday ? "var(--gold)" : "var(--text)", fontWeight: isToday ? 700 : 500 }}>{d}</div>
              {daySessions.length > 0 && (
                <div style={{ display: "flex", flexDirection: "column", gap: 2, marginTop: 4 }}>
                  {platformsUsed.slice(0, 3).map((p) => {
                    const total = daySessions.filter((s) => s.platform === p).reduce((a, s) => a + s.durationMin, 0);
                    return (
                      <div key={p} style={{ fontSize: 10, display: "flex", alignItems: "center", gap: 4, color: PLATFORMS[p].accent }}>
                        <span style={{ width: 5, height: 5, borderRadius: 999, background: PLATFORMS[p].accent }} />
                        {durationLabel(total)}
                      </div>
                    );
                  })}
                </div>
              )}
            </button>
          );
        })}
      </div>
    </Card>
  );
}

function RevenueBreakdown({ breakdown, displayCurrency }) {
  const corrupt = breakdown.filter((e) => e.corrupt);
  const relevant = breakdown.filter((e) => !e.corrupt && e.originalCurrency !== displayCurrency);
  const notes = breakdown.filter((e) => !e.corrupt && e.note);
  if (relevant.length === 0 && notes.length === 0 && corrupt.length === 0) return null;
  return (
    <div style={{ marginTop: 12, borderTop: "1px solid var(--border)", paddingTop: 10 }}>
      {relevant.length > 0 && (
        <>
          <div style={{ fontSize: 11.5, color: "var(--muted)", marginBottom: 6 }}>Como isso foi convertido:</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
            {relevant.map((e, i) => (
              <div key={i} style={{ fontSize: 12, color: "var(--muted)", display: "flex", justifyContent: "space-between", gap: 8 }}>
                <span>{e.label} ({PLATFORMS[e.platform].label}) — {fmt(e.originalAmount, e.originalCurrency)}</span>
                {e.rate ? (
                  <span>× {e.rate.toLocaleString("pt-BR", { maximumFractionDigits: 6 })} = {fmt(e.convertedAmount, displayCurrency)}</span>
                ) : (
                  <span style={{ color: "#E8917A" }}>sem taxa cadastrada</span>
                )}
              </div>
            ))}
          </div>
          <div style={{ fontSize: 11, color: "var(--muted)", marginTop: 6 }}>Taxa: 1 {relevant[0]?.originalCurrency} = X {displayCurrency}, definida em Configurações (automática ou manual). Confira lá se o número parecer errado.</div>
        </>
      )}
      {notes.map((e, i) => (
        <div key={"n" + i} className="niva-hint warn" style={{ marginTop: 8 }}><AlertTriangle size={13} /> {e.label} ({PLATFORMS[e.platform].label}): {e.note}</div>
      ))}
      {corrupt.map((e, i) => (
        <div key={"c" + i} className="niva-hint warn" style={{ marginTop: 8 }}><AlertTriangle size={13} /> {e.label} ({PLATFORMS[e.platform].label}): valor salvo ilegível — excluído do total (não tratado como zero, não apagado do registro).</div>
      ))}
    </div>
  );
}

function IncompleteRevenueNotice({ agg, displayCurrency }) {
  const unconvertedEntries = Object.entries(agg.unconvertedByCurrency || {});
  const hasIssue = agg.manualNeeded > 0 || unconvertedEntries.length > 0 || agg.corruptEntries > 0;
  if (!hasIssue) return null;
  return (
    <div style={{ marginTop: 4 }}>
      {agg.manualNeeded > 0 && (
        <div className="niva-hint warn" style={{ marginTop: 6 }}><AlertTriangle size={13} /> {agg.manualNeeded} item(ns) precisam da receita real informada manualmente — não entram neste total.</div>
      )}
      {unconvertedEntries.length > 0 && (
        <div className="niva-hint warn" style={{ marginTop: 6 }}>
          <AlertTriangle size={13} /> Total incompleto — falta taxa de câmbio para: {unconvertedEntries.map(([cur, amt]) => `${fmt(amt, cur)}`).join(", ")}. Esse dinheiro existe mas não está somado ao número acima.
        </div>
      )}
      {agg.corruptEntries > 0 && (
        <div className="niva-hint warn" style={{ marginTop: 6 }}><AlertTriangle size={13} /> {agg.corruptEntries} registro(s) com valor salvo ilegível — excluídos do total, não apagados.</div>
      )}
    </div>
  );
}

function StatBlock({ label, value, sub, comparison }) {
  return (
    <Card style={{ padding: "18px 20px" }}>
      <div style={{ fontSize: 12.5, color: "var(--muted)", marginBottom: 6 }}>{label}</div>
      <div style={{ fontFamily: "var(--font-display)", fontSize: 26 }}>{value}</div>
      {sub && <div style={{ fontSize: 12, color: "var(--muted)", marginTop: 4 }}>{sub}</div>}
      {comparison !== undefined && <div style={{ marginTop: 8 }}><ComparisonDelta metric={comparison} /></div>}
    </Card>
  );
}

function InsightsCard({ insights, fallback }) {
  return (
    <Card style={{ padding: 20, marginBottom: 20 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 12 }}>
        <Lightbulb size={16} style={{ color: "var(--gold)" }} />
        <div style={{ fontSize: 13.5, fontWeight: 600 }}>Insights</div>
      </div>
      {fallback ? (
        <div style={{ fontSize: 13, color: "var(--muted)" }}>{fallback}</div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {insights.map((ins, i) => (
            <div key={i} style={{ fontSize: 13.5, display: "flex", gap: 8 }}>
              <span>{ins.icon}</span><span>{ins.text}</span>
            </div>
          ))}
        </div>
      )}
