}

function Dashboard({ allSessions, settings, dateRange, dateRangeControl, onQuickAdd, onOpenDay, fxState, onRefreshRates }) {
  const filtered = filterSessionsByDateRange(allSessions, dateRange);
  const previousRange = getPreviousComparablePeriod(dateRange);
  const previousSessions = previousRange ? filterSessionsByDateRange(allSessions, previousRange) : [];

  const rateResolver = useMemo(() => makeRateResolver(settings, false), [settings]);
  const activity = calculateActivityMetrics(filtered);
  const revenue = calculateRevenueMetrics(filtered, settings.currency, rateResolver, settings.accountStatus);
  const comparison = calculateComparisonMetrics(filtered, previousSessions, settings.currency, rateResolver, settings.accountStatus);
  const platformMetrics = calculatePlatformMetrics(filtered, settings.currency, rateResolver, settings.accountStatus);
  const streak = calculateStreamingStreak(filtered);
  const { insights, fallback } = generateInsights({ sessions: filtered, activityMetrics: activity, platformMetrics, comparison, streak });

  const recent = [...allSessions].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 6);
  const rangeLabel = DATE_RANGE_OPTIONS.find((o) => o.key === dateRange.type)?.label || "Personalizado";

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20, flexWrap: "wrap", gap: 10 }}>
        <div>
          <div style={{ fontFamily: "var(--font-display)", fontSize: 26 }}>Painel</div>
          <div style={{ color: "var(--muted)", fontSize: 13.5 }}>{rangeLabel}</div>
        </div>
        <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
          {dateRangeControl}
          <button className="niva-btn primary" onClick={onQuickAdd}><Plus size={15} /> Registrar Stream</button>
        </div>
      </div>

      {allSessions.length === 0 ? (
        <Card style={{ padding: 0 }}>
          <EmptyState
            title="Seu histórico começa aqui"
            body="Registre sua primeira stream para começar."
            action={<button className="niva-btn primary" onClick={onQuickAdd}><Plus size={15} /> Registrar Stream</button>}
          />
        </Card>
      ) : filtered.length === 0 ? (
        <Card style={{ padding: 0, marginBottom: 20 }}>
          <EmptyState title="Nenhuma atividade neste período" body="Não há streams registradas dentro do intervalo selecionado. Tente outro período no filtro acima." />
        </Card>
      ) : (
        <>
          <FxRateIndicator settings={settings} fxState={fxState} onRefresh={onRefreshRates} />
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(180px, 1fr))", gap: 14, marginBottom: 8 }}>
            <StatBlock label="Horas transmitidas" value={durationLabel(revenue.hours * 60)} comparison={comparison?.hours} />
            <StatBlock label="Streams" value={`${filtered.length} stream${filtered.length === 1 ? "" : "s"}`} comparison={comparison?.streams} />
            <StatBlock label="Dias ativos" value={`${activity.activeDays} dia${activity.activeDays === 1 ? "" : "s"}`} comparison={comparison?.activeDays} />
            <StatBlock label="Receita Real" value={fmt(revenue.actualTotal, settings.currency)} comparison={comparison?.revenueActual} />
            <StatBlock label="Receita Calculada" value={fmt(revenue.estimatedTotal, settings.currency)} sub="🟡 Estimada — nunca somada à receita real" />
            <StatBlock label="Receita por Hora" value={revenue.revPerHourReal !== null ? fmt(revenue.revPerHourReal, settings.currency) : "—"} sub={revenue.revPerHourReal !== null ? undefined : "Dados insuficientes"} comparison={comparison?.revenuePerHour} />
          </div>

          {(revenue.breakdown.length > 0 || revenue.manualNeeded > 0) && (
            <Card style={{ padding: 16, marginBottom: 20 }}>
              <RevenueBreakdown breakdown={revenue.breakdown} displayCurrency={settings.currency} />
              <IncompleteRevenueNotice agg={revenue} displayCurrency={settings.currency} />
            </Card>
          )}

          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(220px, 1fr))", gap: 14, marginBottom: 20 }}>
            {PLATFORM_ORDER.filter((k) => settings.platforms[k]).map((k) => {
              const p = platformMetrics[k];
              return (
                <Card key={k} style={{ padding: 16, borderTop: `2px solid ${PLATFORMS[k].accent}` }}>
                  <PlatformTag platform={k} />
                  <div style={{ fontFamily: "var(--font-display)", fontSize: 22, marginTop: 8 }}>{fmt(p.actual + p.estimated, settings.currency)}</div>
                  <div style={{ fontSize: 12, color: "var(--muted)", marginTop: 4 }}>{durationLabel(p.hours * 60)} · {p.streams} sessões</div>
                </Card>
              );
            })}
          </div>

          <InsightsCard insights={insights} fallback={fallback} />

          <Card style={{ padding: 20 }}>
            <div style={{ fontSize: 13.5, fontWeight: 600, marginBottom: 12 }}>Atividade recente</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {recent.map((s) => (
                <div key={s.id} onClick={() => onOpenDay(s.date)} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 4px", cursor: "pointer", borderBottom: "1px solid var(--border)" }}>
                  <div style={{ display: "flex", gap: 12, alignItems: "center" }}>
                    <PlatformTag platform={s.platform} />
                    <span style={{ fontSize: 13, color: "var(--muted)" }}>{new Date(s.date + "T00:00:00").toLocaleDateString("pt-BR")}</span>
                  </div>
                  <span style={{ fontSize: 13, color: "var(--muted)" }}>{durationLabel(s.durationMin)}</span>
                </div>
              ))}
            </div>
          </Card>
        </>
      )}
    </div>
  );
}

// Rate transparency indicator (Feature 17): shows the FX pairs actually driving the numbers on
// screen, and when they were last updated, so a person can tell "my Bits count didn't change, but
// the ¥ total did — here's why." Renders nothing if display currency needs no conversion at all
// (no foreign-currency pairs configured yet).
function FxRateIndicator({ settings, fxState, onRefresh }) {
  const [open, setOpen] = useState(false);
  const pairs = CURRENCIES.filter((c) => c !== settings.currency && Number.isFinite(settings.exchangeRates?.[c]) && settings.exchangeRates[c] > 0);
  if (pairs.length === 0 && settings.rateMode !== "auto") return null;
  const updatedAt = settings.exchangeRatesMeta?.updatedAt ? new Date(settings.exchangeRatesMeta.updatedAt) : null;
  const isToday = updatedAt && updatedAt.toDateString() === new Date().toDateString();
  const updatedLabel = updatedAt ? (isToday ? "Hoje" : updatedAt.toLocaleDateString("pt-BR")) : "—";
  return (
    <Card style={{ padding: "10px 14px", marginBottom: 14 }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, flexWrap: "wrap", cursor: "pointer" }} onClick={() => setOpen((o) => !o)}>
        <div style={{ display: "flex", gap: 16, flexWrap: "wrap", fontSize: 12.5 }}>
          {pairs.length > 0 ? pairs.map((c) => (
            <span key={c}><span style={{ color: "var(--muted)" }}>FX rate</span> <b>{c}/{settings.currency}</b> {settings.exchangeRates[c].toLocaleString("pt-BR", { maximumFractionDigits: 4 })}</span>
          )) : <span style={{ color: "var(--muted)" }}>Nenhuma taxa de câmbio configurada ainda.</span>}
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 12, color: "var(--muted)" }}>
          <span>Updated: {updatedLabel}</span>
          {settings.rateMode === "auto" && (
            <button
              className="niva-icon-btn"
              onClick={(e) => { e.stopPropagation(); onRefresh?.(); }}
              disabled={fxState?.loading}
              title="Atualizar cotação agora"
            >
              {fxState?.loading ? "…" : "↻"}
            </button>
          )}
          <ChevronDown size={14} style={{ transform: open ? "rotate(180deg)" : "none", transition: "transform 0.15s" }} />
        </div>
      </div>
      {open && (
        <div className="niva-hint" style={{ marginTop: 8 }}>
          Revenue is calculated in its original currency first and then converted to {settings.currency === "JPY" ? "Japanese Yen" : settings.currency} using {settings.rateMode === "auto" ? "the latest available exchange rate" : "the rate you set manually in Settings"}. That's why the {settings.currency} total can change even when the original amount (e.g. Bits) stays exactly the same.
          {settings.currency !== "USD" && Number.isFinite(settings.exchangeRates?.USD) && (
            <div style={{ marginTop: 6 }}>Valor atual: 1 Bit (US$0,01 fixo) ≈ {CURRENCY_SYMBOL[settings.currency] || settings.currency + " "}{(BIT_VALUE_USD * settings.exchangeRates.USD).toLocaleString("pt-BR", { minimumFractionDigits: 3, maximumFractionDigits: 3 })}</div>
          )}
        </div>
      )}
      {fxState?.error && (
        <div className="niva-hint warn" style={{ marginTop: 6 }}><AlertTriangle size={12} /> Não foi possível atualizar a cotação agora ({fxState.error}). Usando a última cotação salva.</div>
      )}
    </Card>
  );
}

function PlatformPage({ platform, sessions, settings, dateRange, dateRangeControl, onOpenDay, onChangeSettings }) {
  const p = PLATFORMS[platform];
  const platSessions = filterSessionsByDateRange(sessions.filter((s) => s.platform === platform), dateRange);
  const agg = aggregateRevenue(platSessions, settings.currency, makeRateResolver(settings, false), settings.accountStatus);
  const hours = platSessions.reduce((a, s) => a + s.durationMin, 0) / 60;
  const rangeLabel = DATE_RANGE_OPTIONS.find((o) => o.key === dateRange.type)?.label || "Personalizado";

  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 20, flexWrap: "wrap", gap: 10 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <span style={{ width: 10, height: 10, borderRadius: 999, background: p.accent }} />
          <div>
            <div style={{ fontFamily: "var(--font-display)", fontSize: 26 }}>{p.label}</div>
            <div style={{ color: "var(--muted)", fontSize: 12.5 }}>{rangeLabel}</div>
          </div>
        </div>
        {dateRangeControl}
      </div>

      {platform === "twitch" && (
        <>
          <Accordion
            title="Account Status"
            badge={<span style={{ fontSize: 12, color: "var(--muted)" }}>{{ streamer: "Streamer", affiliate: "Affiliate", partner: "Partner" }[settings.accountStatus?.twitch || "streamer"]}</span>}
          >
            <TwitchAccountStatus settings={settings} onChangeSettings={onChangeSettings} />
          </Accordion>
          <Accordion
            title="Programa de revenue share (assinaturas)"
            badge={<span style={{ fontSize: 12, color: "var(--muted)" }}>{{ standard: "50/50", plus60: "60/40", plus70: "70/30", custom: "Custom" }[settings.subProgram?.twitch || "standard"]}</span>}
          >
            <TwitchSubProgram settings={settings} onChangeSettings={onChangeSettings} />
          </Accordion>
          <Accordion
            title="💎 Preços de Bits no Japão 🇯🇵"
            subtitle="Informativo — não entra no cálculo da sua receita"
            badge={<StatusPill status={RULES_META.japanPricing.status} />}
          >
            <BitsJapanPricing />
          </Accordion>
        </>
      )}

      {platSessions.length === 0 ? (
        <Card style={{ padding: 0 }}>
          {sessions.filter((s) => s.platform === platform).length === 0 ? (
            <EmptyState title={`Nenhuma stream registrada nesta plataforma`} body="Sessões desta plataforma aparecerão aqui assim que forem adicionadas." />
          ) : (
            <EmptyState title="Nenhuma sessão neste período" body="Não há streams desta plataforma dentro do intervalo selecionado. Tente outro período no filtro acima." />
          )}
        </Card>
      ) : (
        <>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(180px, 1fr))", gap: 14, marginBottom: 20 }}>
            <StatBlock label={(agg.manualNeeded > 0 || Object.keys(agg.unconvertedByCurrency || {}).length > 0) ? "Receita conhecida" : "Receita total"} value={fmt(agg.actualTotal + agg.estimatedTotal, settings.currency)} sub={`Real ${fmt(agg.actualTotal, settings.currency)} · Estimado ${fmt(agg.estimatedTotal, settings.currency)}`} />
            <StatBlock label="Horas totais" value={durationLabel(hours * 60)} />
            <StatBlock label="Sessões" value={String(platSessions.length)} />
            <StatBlock label="Receita / hora (conhecida)" value={fmt(hours > 0 ? (agg.actualTotal + agg.estimatedTotal) / hours : 0, settings.currency)} />
          </div>
          {(agg.breakdown.length > 0 || agg.manualNeeded > 0) && (
            <Accordion title="Detalhes da receita" subtitle="Como cada valor foi calculado ou convertido" defaultOpen={agg.manualNeeded > 0 || Object.keys(agg.unconvertedByCurrency || {}).length > 0}>
              <RevenueBreakdown breakdown={agg.breakdown} displayCurrency={settings.currency} />
              <IncompleteRevenueNotice agg={agg} displayCurrency={settings.currency} />
            </Accordion>
          )}

          {platform === "twitch" && (() => {
            const totals = platSessions.reduce((acc, s) => {
              const d = s.data || {};
              acc.tier1 += d.tier1 || 0; acc.tier2 += d.tier2 || 0; acc.tier3 += d.tier3 || 0;
              acc.gift += d.giftCount || 0; acc.prime += d.primeCount || 0; acc.legacy += d.subCount || 0;
              return acc;
            }, { tier1: 0, tier2: 0, tier3: 0, gift: 0, prime: 0, legacy: 0 });
            const any = totals.tier1 || totals.tier2 || totals.tier3 || totals.gift || totals.prime || totals.legacy;
            if (!any) return null;
            return (
              <Accordion title="Assinaturas — contagem" subtitle="Não é receita">
                <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(100px, 1fr))", gap: 12 }}>
                  <div><div style={{ fontSize: 11.5, color: "var(--muted)" }}>Tier 1</div><div style={{ fontFamily: "var(--font-display)", fontSize: 20 }}>{totals.tier1.toLocaleString("pt-BR")}</div></div>
                  <div><div style={{ fontSize: 11.5, color: "var(--muted)" }}>Tier 2</div><div style={{ fontFamily: "var(--font-display)", fontSize: 20 }}>{totals.tier2.toLocaleString("pt-BR")}</div></div>
                  <div><div style={{ fontSize: 11.5, color: "var(--muted)" }}>Tier 3</div><div style={{ fontFamily: "var(--font-display)", fontSize: 20 }}>{totals.tier3.toLocaleString("pt-BR")}</div></div>
                  <div><div style={{ fontSize: 11.5, color: "var(--muted)" }}>Gift Subs</div><div style={{ fontFamily: "var(--font-display)", fontSize: 20 }}>{totals.gift.toLocaleString("pt-BR")}</div></div>
                  <div><div style={{ fontSize: 11.5, color: "var(--muted)" }}>Prime Subs</div><div style={{ fontFamily: "var(--font-display)", fontSize: 20 }}>{totals.prime.toLocaleString("pt-BR")}</div></div>
                  {totals.legacy > 0 && <div><div style={{ fontSize: 11.5, color: "var(--muted)" }}>Assinaturas (legado)</div><div style={{ fontFamily: "var(--font-display)", fontSize: 20 }}>{totals.legacy.toLocaleString("pt-BR")}</div></div>}
                </div>
                <div style={{ fontSize: 11.5, color: "var(--muted)", marginTop: 10 }}>Essas contagens nunca são multiplicadas por preço — servem só para acompanhamento. A receita real vem sempre do campo manual.</div>
              </Accordion>
            );
          })()}

          <Card style={{ padding: 20, marginTop: 4 }}>
            <div style={{ fontSize: 13.5, fontWeight: 600, marginBottom: 12 }}>Histórico de sessões</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {[...platSessions].sort((a, b) => b.date.localeCompare(a.date)).map((s) => {
                const rev = sessionRevenue(s, settings.accountStatus);
                return (
                  <div key={s.id} onClick={() => onOpenDay(s.date)} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 4px", cursor: "pointer", borderBottom: "1px solid var(--border)", flexWrap: "wrap", gap: 8 }}>
                    <div>
                      <div style={{ fontSize: 13.5 }}>{new Date(s.date + "T00:00:00").toLocaleDateString("pt-BR")}</div>
                      <div style={{ fontSize: 12, color: "var(--muted)" }}>{durationLabel(s.durationMin)}</div>
                    </div>
                    <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                      {rev.actual.map((e, i) => <StatusPill key={"a" + i} status="actual" />)}
                      {rev.estimated.map((e, i) => <StatusPill key={"e" + i} status="estimated" />)}
                      {rev.needsManual.map((l, i) => <StatusPill key={"m" + i} status="manual" />)}
                    </div>
                  </div>
                );
              })}
            </div>
          </Card>
        </>
      )}
    </div>
  );
}

// A single bar-chart primitive shared by every "evolution" chart in Analytics. Shows its own
// empty state instead of a flat/fake line whenever there isn't enough data to plot (Feature 6).
function MiniBarChart({ data, formatValue, emptyLabel }) {
  const entries = Object.entries(data);
  if (entries.length === 0) {
    return <div style={{ fontSize: 12.5, color: "var(--muted)", padding: "20px 0", textAlign: "center" }}>{emptyLabel || "Ainda não existem dados suficientes para este gráfico."}</div>;
  }
  const sorted = entries.sort((a, b) => a[0].localeCompare(b[0]));
  const max = Math.max(1, ...sorted.map(([, v]) => v));
  return (
    <div style={{ display: "flex", alignItems: "flex-end", gap: 3, height: 70 }}>
      {sorted.map(([key, v]) => (
        <div key={key} title={`${key}: ${formatValue ? formatValue(v) : v}`} style={{ flex: 1, minWidth: 3, height: `${Math.max(4, (v / max) * 100)}%`, background: "var(--gold)", borderRadius: 2, opacity: 0.85 }} />
      ))}
    </div>
  );
}

function Analytics({ sessions, settings, dateRange, dateRangeControl }) {
  // Feature 18: historical charts default to the rate that was actually in effect on each day
  // (never repainted by today's rate). "Ver na cotação de hoje" is the explicit opt-in to compare
  // everything using the current rate instead — off by default, remembered per Analytics visit.
  const [useTodayRate, setUseTodayRate] = useState(false);
  const rateResolver = useMemo(() => makeRateResolver(settings, useTodayRate), [settings, useTodayRate]);

  const filtered = filterSessionsByDateRange(sessions, dateRange);
  const previousRange = getPreviousComparablePeriod(dateRange);
  const previousSessions = previousRange ? filterSessionsByDateRange(sessions, previousRange) : [];

  const agg = aggregateRevenue(filtered, settings.currency, rateResolver, settings.accountStatus);
  const totalHours = filtered.reduce((a, s) => a + s.durationMin, 0) / 60;
  const totalRevenue = agg.actualTotal + agg.estimatedTotal;

  const activity = calculateActivityMetrics(filtered);
  const time = calculateTimeMetrics(filtered);
  const platformMetrics = calculatePlatformMetrics(filtered, settings.currency, rateResolver, settings.accountStatus);
  const comparison = calculateComparisonMetrics(filtered, previousSessions, settings.currency, rateResolver, settings.accountStatus);
  const streak = calculateStreamingStreak(filtered);
  const { insights, fallback } = generateInsights({ sessions: filtered, activityMetrics: activity, platformMetrics, comparison, streak });

  const { granularity, buckets: activityBuckets } = useMemo(() => bucketSessions(filtered, dateRange), [filtered, dateRange]);
  const hoursByBucket = useMemo(() => Object.fromEntries(Object.entries(activityBuckets).map(([k, v]) => [k, v.hours])), [activityBuckets]);
  const streamsByBucket = useMemo(() => Object.fromEntries(Object.entries(activityBuckets).map(([k, v]) => [k, v.streams])), [activityBuckets]);

  // Revenue-by-bucket derived from agg.breakdown (the same data behind actualTotal), so this
  // chart can never drift out of sync with the headline number — same discipline as the old chart.
  const revenueByBucket = useMemo(() => {
    const map = {};
    agg.breakdown.forEach((e) => {
      if (e.convertedAmount === null || e.convertedAmount === undefined || e.status !== "actual") return;
      const key = bucketKeyForDate(e.date, granularity);
      map[key] = (map[key] || 0) + e.convertedAmount;
    });
    return map;
  }, [agg, granularity]);

  const avgStreamsPerWeek = useMemo(() => {
    const lengthDays = daysBetweenISO(dateRange.startDate, dateRange.endDate) + 1;
    if (lengthDays <= 0) return null;
    const weeks = lengthDays / 7;
    return weeks > 0 ? filtered.length / weeks : null;
  }, [filtered, dateRange]);

  const taxReserve = settings.taxReserveMode === "percent" ? totalRevenue * (settings.taxReservePercent / 100) : settings.taxReserveManual;
  const rangeLabel = DATE_RANGE_OPTIONS.find((o) => o.key === dateRange.type)?.label || "Personalizado";

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16, flexWrap: "wrap", gap: 10 }}>
        <div style={{ fontFamily: "var(--font-display)", fontSize: 26 }}>Analytics</div>
        <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
          {Object.keys(settings.rateHistory || {}).length > 0 && (
            <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, color: "var(--muted)", cursor: "pointer" }}>
              <input type="checkbox" checked={useTodayRate} onChange={(e) => setUseTodayRate(e.target.checked)} />
              Ver na cotação de hoje
            </label>
          )}
          {dateRangeControl}
        </div>
      </div>
      {Object.keys(settings.rateHistory || {}).length > 0 && (
        <div className="niva-hint" style={{ marginBottom: 12 }}>
          {useTodayRate
            ? "Todos os valores abaixo estão recalculados usando a cotação de câmbio de hoje."
            : "Cada dia usa a cotação de câmbio que estava em vigor naquele dia — a evolução histórica não é reescrita quando a cotação muda."}
        </div>
      )}

      {sessions.length === 0 ? (
        <Card style={{ padding: 0 }}><EmptyState title="Ainda não existem dados suficientes para análise" body="Continue registrando suas streams." /></Card>
      ) : filtered.length === 0 ? (
        <Card style={{ padding: 0 }}><EmptyState title="Nenhuma atividade neste período" body="Não há streams registradas dentro do intervalo selecionado. Tente outro período no filtro acima." /></Card>
      ) : (
        <>
          <Card style={{ padding: 20, marginBottom: 16 }}>
            <div style={{ fontSize: 12.5, color: "var(--muted)", marginBottom: 6 }}>{(agg.manualNeeded > 0 || Object.keys(agg.unconvertedByCurrency || {}).length > 0) ? "Receita conhecida" : "Receita total"} ({rangeLabel})</div>
            <div style={{ fontFamily: "var(--font-display)", fontSize: 34 }}>{fmt(totalRevenue, settings.currency)}</div>
            <div style={{ display: "flex", gap: 14, marginTop: 10, flexWrap: "wrap" }}>
              <span style={{ fontSize: 13, color: "#7BE0A8" }}>🟢 Real: {fmt(agg.actualTotal, settings.currency)}</span>
              <span style={{ fontSize: 13, color: "#F2C94C" }}>🟡 Calculado: {fmt(agg.estimatedTotal, settings.currency)}</span>
            </div>
            <div style={{ marginTop: 16 }}>
              <MiniBarChart data={revenueByBucket} formatValue={(v) => fmt(v, settings.currency)} />
            </div>
            <RevenueBreakdown breakdown={agg.breakdown} displayCurrency={settings.currency} />
            <IncompleteRevenueNotice agg={agg} displayCurrency={settings.currency} />
          </Card>

          {/* A. Consistência */}
          <Card style={{ padding: 20, marginBottom: 16 }}>
            <div style={{ fontSize: 13.5, fontWeight: 600, marginBottom: 14 }}>Consistência</div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(160px, 1fr))", gap: 14, marginBottom: 16 }}>
              <div><div style={{ fontSize: 11.5, color: "var(--muted)" }}>Dias ativos</div><div style={{ fontFamily: "var(--font-display)", fontSize: 22, marginTop: 4 }}>{activity.activeDays}</div></div>
              <div><div style={{ fontSize: 11.5, color: "var(--muted)" }}>Média de streams / semana</div><div style={{ fontFamily: "var(--font-display)", fontSize: 22, marginTop: 4 }}>{avgStreamsPerWeek !== null ? avgStreamsPerWeek.toLocaleString("pt-BR", { maximumFractionDigits: 1 }) : "—"}</div></div>
              <div><div style={{ fontSize: 11.5, color: "var(--muted)" }}>Maior sequência</div><div style={{ fontFamily: "var(--font-display)", fontSize: 22, marginTop: 4, display: "flex", alignItems: "center", gap: 6 }}>{streak > 0 && <Flame size={16} style={{ color: "#F2994A" }} />}{streak} dia{streak === 1 ? "" : "s"}</div></div>
            </div>
            <div style={{ fontSize: 11.5, color: "var(--muted)", marginBottom: 6 }}>Streams por {granularity === "day" ? "dia" : granularity === "week" ? "semana" : "mês"}</div>
            <MiniBarChart data={streamsByBucket} formatValue={(v) => `${v} stream${v === 1 ? "" : "s"}`} />
          </Card>

          {/* B. Tempo de stream */}
          <Card style={{ padding: 20, marginBottom: 16 }}>
            <div style={{ fontSize: 13.5, fontWeight: 600, marginBottom: 14 }}>Tempo de stream</div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(150px, 1fr))", gap: 14, marginBottom: 16 }}>
              <div><div style={{ fontSize: 11.5, color: "var(--muted)" }}>Total de horas</div><div style={{ fontFamily: "var(--font-display)", fontSize: 20, marginTop: 4 }}>{durationLabel(time.totalMin)}</div></div>
              <div><div style={{ fontSize: 11.5, color: "var(--muted)" }}>Média por stream</div><div style={{ fontFamily: "var(--font-display)", fontSize: 20, marginTop: 4 }}>{time.avgMin !== null ? durationLabel(time.avgMin) : "—"}</div></div>
              <div><div style={{ fontSize: 11.5, color: "var(--muted)" }}>Maior stream</div><div style={{ fontFamily: "var(--font-display)", fontSize: 20, marginTop: 4 }}>{time.longest ? durationLabel(time.longest.durationMin) : "—"}</div></div>
              <div><div style={{ fontSize: 11.5, color: "var(--muted)" }}>Menor stream</div><div style={{ fontFamily: "var(--font-display)", fontSize: 20, marginTop: 4 }}>{time.shortest ? durationLabel(time.shortest.durationMin) : "—"}</div></div>
            </div>
            <div style={{ fontSize: 11.5, color: "var(--muted)", marginBottom: 6 }}>Horas por {granularity === "day" ? "dia" : granularity === "week" ? "semana" : "mês"}</div>
            <MiniBarChart data={hoursByBucket} formatValue={(v) => durationLabel(v * 60)} />
          </Card>

          {/* C. Plataformas */}
          <Card style={{ padding: 20, marginBottom: 16, overflowX: "auto" }}>
            <div style={{ fontSize: 13.5, fontWeight: 600, marginBottom: 14 }}>Plataformas</div>
            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13, minWidth: 420 }}>
              <thead>
                <tr style={{ textAlign: "left", color: "var(--muted)", fontSize: 11.5 }}>
                  <th style={{ paddingBottom: 8 }}>Plataforma</th><th style={{ textAlign: "right" }}>Streams</th><th style={{ textAlign: "right" }}>Horas</th><th style={{ textAlign: "right" }}>Receita Real</th>
                </tr>
              </thead>
              <tbody>
                {PLATFORM_ORDER.filter((k) => settings.platforms[k]).map((k) => {
                  const p = platformMetrics[k];
                  return (
                    <tr key={k} style={{ borderTop: "1px solid var(--border)" }}>
                      <td style={{ padding: "9px 0" }}><PlatformTag platform={k} /></td>
                      <td style={{ textAlign: "right" }}>{p.streams}</td>
                      <td style={{ textAlign: "right" }}>{durationLabel(p.hours * 60)}</td>
                      <td style={{ textAlign: "right" }}>{fmt(p.actual, settings.currency)}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </Card>

          <InsightsCard insights={insights} fallback={fallback} />

          {comparison && (
            <Card style={{ padding: 20, marginBottom: 16 }}>
              <div style={{ fontSize: 13.5, fontWeight: 600, marginBottom: 14 }}>Comparação com período anterior</div>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(160px, 1fr))", gap: 16 }}>
                <div><div style={{ fontSize: 11.5, color: "var(--muted)", marginBottom: 6 }}>Horas</div><ComparisonDelta metric={comparison.hours} /></div>
                <div><div style={{ fontSize: 11.5, color: "var(--muted)", marginBottom: 6 }}>Streams</div><ComparisonDelta metric={comparison.streams} /></div>
                <div><div style={{ fontSize: 11.5, color: "var(--muted)", marginBottom: 6 }}>Dias ativos</div><ComparisonDelta metric={comparison.activeDays} /></div>
                <div><div style={{ fontSize: 11.5, color: "var(--muted)", marginBottom: 6 }}>Receita Real</div><ComparisonDelta metric={comparison.revenueActual} /></div>
                <div><div style={{ fontSize: 11.5, color: "var(--muted)", marginBottom: 6 }}>Receita / hora</div><ComparisonDelta metric={comparison.revenuePerHour} /></div>
              </div>
            </Card>
          )}

          <Card style={{ padding: 20 }}>
            <div style={{ fontSize: 13.5, fontWeight: 600, marginBottom: 10 }}>Reserva de imposto (estimativa pessoal)</div>
            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 14, marginBottom: 6 }}>
              <span>Receita da plataforma</span><span>{fmt(totalRevenue, settings.currency)}</span>
            </div>
            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 14, marginBottom: 6 }}>
              <span>Reserva de imposto {settings.taxReserveMode === "percent" ? `(${settings.taxReservePercent}%)` : "(manual)"}</span><span>− {fmt(taxReserve, settings.currency)}</span>
            </div>
            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 16, fontWeight: 700, borderTop: "1px solid var(--border)", paddingTop: 10, marginTop: 4 }}>
              <span>Valor restante estimado</span><span>{fmt(totalRevenue - taxReserve, settings.currency)}</span>
            </div>
            <div className="niva-hint warn" style={{ marginTop: 12 }}><AlertTriangle size={13} /> A reserva de imposto é uma estimativa pessoal e não representa aconselhamento fiscal oficial nem um cálculo tributário oficial.</div>
          </Card>
        </>
      )}
    </div>
  );
}

function CurrentStatusNote({ rule }) {
  if (!rule.currentRuleStatus || rule.currentRuleStatus === "CURRENT_AT_PUBLICATION") return null;
  return (
    <div className="niva-hint warn" style={{ marginTop: 8 }}>
      <AlertTriangle size={13} /> Fonte oficial ≠ regra atual: {rule.currentStatusNote || "confirmamos o que a fonte disse na data de publicação, mas não reconfirmamos de forma independente se a regra segue igual hoje."}
    </div>
  );
}

function BackupSection({ settings, sessions, onImportBackup }) {
  const [pending, setPending] = useState(null); // parsed file awaiting confirmation
  const [fileError, setFileError] = useState(null);
  const [result, setResult] = useState(null);
  const [importing, setImporting] = useState(false);

  const exportBackup = () => {
    const payload = {
      app: "NIVA",
      exportVersion: 1,
      exportedAt: new Date().toISOString(),
      dataVersion: { settings: SETTINGS_SCHEMA_VERSION, sessions: SESSIONS_SCHEMA_VERSION },
      settings,
      sessions,
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `niva-backup-${todayISO()}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const onFileSelected = async (e) => {
    setFileError(null); setResult(null); setPending(null);
    const file = e.target.files?.[0];
    e.target.value = ""; // allow re-selecting the same file later
    if (!file) return;
    try {
      const text = await file.text();
      const parsed = JSON.parse(text);
      if (!parsed || typeof parsed !== "object" || parsed.app !== "NIVA" || !Array.isArray(parsed.sessions) || typeof parsed.settings !== "object") {
        setFileError("Esse arquivo não parece ser um backup válido do NIVA.");
        return;
      }
      const platforms = [...new Set(parsed.sessions.map((s) => s?.platform).filter(Boolean))];
      const currencies = [...new Set(parsed.sessions.flatMap((s) => {
        const d = s?.data || {};
        return [d.actualBitsCurrency, d.actualSubsCurrency, d.actualOtherCurrency, d.actualCurrency, d.currency].filter(Boolean);
      }))];
      setPending({ parsed, summary: { count: parsed.sessions.length, platforms, currencies, exportedAt: parsed.exportedAt } });
    } catch (err) {
      setFileError("Não foi possível ler esse arquivo — verifique se é um JSON de backup do NIVA válido.");
    }
  };

  const confirmImport = async () => {
    if (!pending) return;
    setImporting(true);
    const res = await onImportBackup(pending.parsed);
    setImporting(false);
    setPending(null);
    setResult(res);
  };

  return (
    <Card style={{ padding: 20, marginBottom: 14 }}>
      <div style={{ fontSize: 13.5, fontWeight: 600, marginBottom: 6 }}>Backup</div>
      <div style={{ fontSize: 12, color: "var(--muted)", marginBottom: 14, lineHeight: 1.6 }}>
        Exporta tudo (configurações e sessões, com moedas e valores originais preservados) em um arquivo <code>.json</code> que você guarda por sua conta. Importar substitui os dados atuais — o NIVA guarda uma cópia de segurança do que existia antes de importar.
      </div>
      <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
        <button className="niva-btn ghost" onClick={exportBackup}>Exportar backup</button>
        <label className="niva-btn ghost" style={{ cursor: "pointer" }}>
          Importar backup
          <input type="file" accept="application/json" onChange={onFileSelected} style={{ display: "none" }} />
        </label>
      </div>

      {fileError && <div className="niva-hint warn" style={{ marginTop: 12 }}><AlertTriangle size={13} /> {fileError}</div>}

      {pending && (
        <div style={{ marginTop: 14, padding: 14, border: "1px solid var(--border)", borderRadius: 10, background: "var(--surface-2)" }}>
          <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 6 }}>Backup encontrado</div>
          <div style={{ fontSize: 12.5, color: "var(--muted)", lineHeight: 1.7 }}>
            {pending.summary.count} sessão(ões) · {pending.summary.platforms.length} plataforma(s) ({pending.summary.platforms.join(", ") || "—"}) · {pending.summary.currencies.length} moeda(s) ({pending.summary.currencies.join(", ") || "—"})<br />
            {pending.summary.exportedAt && `Exportado em: ${new Date(pending.summary.exportedAt).toLocaleString("pt-BR")}`}
          </div>
          <div className="niva-hint warn" style={{ marginTop: 10 }}><AlertTriangle size={13} /> Importar e substituir os dados atuais? Uma cópia de segurança do que existe agora será salva antes.</div>
          <div style={{ display: "flex", gap: 10, marginTop: 10 }}>
            <button className="niva-btn ghost" onClick={() => setPending(null)} disabled={importing}>Cancelar</button>
            <button className="niva-btn primary" onClick={confirmImport} disabled={importing}>{importing ? "Importando..." : "Importar e substituir"}</button>
          </div>
        </div>
      )}

      {result && (
        <div className="niva-hint" style={{ marginTop: 12 }}>
          Importado: {result.importedSessions} sessão(ões).{result.skipped > 0 && ` ${result.skipped} registro(s) inválido(s) foram ignorados (guardados à parte, não apagados).`} {result.backedUp ? "Cópia de segurança dos dados anteriores salva." : "Atenção: não foi possível salvar a cópia de segurança dos dados anteriores."}
        </div>
      )}
    </Card>
  );
}

function SettingsPage({ settings, sessions, onChange, onImportBackup, fxState, onRefreshRates }) {
  const set = (k, v) => onChange({ ...settings, [k]: v });
  const setRate = (cur, val) => {
    // A zero or negative exchange rate is nonsensical and would corrupt every conversion using it
    // (multiplying by 0 silently produces a fake "¥0", multiplying by a negative flips the sign of
    // real money) — so treat those the same as "not set" rather than storing a broken rate.
    const n = val === "" ? null : Number(val);
    const clean = n === null || !Number.isFinite(n) || n <= 0 ? undefined : n;
    onChange({ ...settings, exchangeRates: { ...settings.exchangeRates, [cur]: clean }, exchangeRatesMeta: { updatedAt: new Date().toISOString(), source: "manual" } });
  };
  const setCurrency = (newCurrency) => {
    if (newCurrency === settings.currency) return;
    // In manual mode, stored rates mean "1 <currency> = X <display currency> units" — if the
    // display currency changes, every existing rate silently means something different (and
    // wrong) unless cleared, so we confirm and clear rather than reinterpret. In auto mode this
    // isn't a concern: the live rate table gets re-derived for the new currency automatically.
    const hasManualRates = settings.rateMode === "manual" && Object.values(settings.exchangeRates || {}).some((v) => v);
    if (hasManualRates) {
      const ok = window.confirm("Mudar a moeda de exibição invalida as taxas de câmbio manuais atuais (elas foram definidas para a moeda antiga). O NIVA vai limpá-las para evitar conversões erradas — você precisará cadastrá-las de novo. Continuar?");
      if (!ok) return;
      onChange({ ...settings, currency: newCurrency, exchangeRates: {} });
    } else {
      onChange({ ...settings, currency: newCurrency });
    }
  };
  const setRateMode = (mode) => {
    if (mode === settings.rateMode) return;
    onChange({ ...settings, rateMode: mode });
    if (mode === "auto") onRefreshRates?.();
  };

  return (
    <div>
      <div style={{ fontFamily: "var(--font-display)", fontSize: 26, marginBottom: 20 }}>Configurações</div>

      <Card style={{ padding: 20, marginBottom: 14 }}>
        <div style={{ fontSize: 13.5, fontWeight: 600, marginBottom: 14 }}>Perfil</div>
        <label className="niva-label">País / residência</label>
        <input className="niva-input" value={settings.country} onChange={(e) => set("country", e.target.value)} style={{ marginBottom: 14 }} />
        <label className="niva-label">Moeda de exibição</label>
        <select className="niva-input" value={settings.currency} onChange={(e) => setCurrency(e.target.value)}>
          {CURRENCIES.map((c) => <option key={c}>{c}</option>)}
        </select>
      </Card>

      <Card style={{ padding: 20, marginBottom: 14 }}>
        <div style={{ fontSize: 13.5, fontWeight: 600, marginBottom: 14 }}>Plataformas ativas</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {PLATFORM_ORDER.map((k) => (
            <label key={k} className="niva-toggle-row" style={{ borderColor: settings.platforms[k] ? PLATFORMS[k].accent : "var(--border)" }}>
              <PlatformTag platform={k} />
              <input type="checkbox" checked={settings.platforms[k]} onChange={(e) => set("platforms", { ...settings.platforms, [k]: e.target.checked })} />
            </label>
          ))}
        </div>
        <div style={{ fontSize: 12, color: "var(--muted)", marginTop: 10 }}>Desativar uma plataforma oculta ela das telas de entrada, mas preserva todo o histórico já registrado.</div>
      </Card>

      <Card style={{ padding: 20, marginBottom: 14 }}>
        <div style={{ fontSize: 13.5, fontWeight: 600, marginBottom: 6 }}>Taxas de câmbio</div>
        <div style={{ fontSize: 12, color: "var(--muted)", marginBottom: 14 }}>O valor original de cada lançamento (ex.: Bits em US$) é sempre preservado — a conversão só afeta a exibição em {settings.currency}.</div>
        <div style={{ display: "flex", gap: 10, marginBottom: 14 }}>
          <button className="niva-chip" onClick={() => setRateMode("auto")} style={{ borderColor: settings.rateMode === "auto" ? "var(--gold)" : "var(--border)", color: settings.rateMode === "auto" ? "var(--gold)" : "var(--muted)" }}>Automática (ao vivo)</button>
          <button className="niva-chip" onClick={() => setRateMode("manual")} style={{ borderColor: settings.rateMode === "manual" ? "var(--gold)" : "var(--border)", color: settings.rateMode === "manual" ? "var(--gold)" : "var(--muted)" }}>Manual</button>
        </div>

        {settings.rateMode === "auto" ? (
          <div>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
              <span style={{ fontSize: 12, color: "var(--muted)" }}>
                Atualizado: {settings.exchangeRatesMeta?.updatedAt ? new Date(settings.exchangeRatesMeta.updatedAt).toLocaleString("pt-BR") : "nunca"}
              </span>
              <button className="niva-btn ghost" onClick={() => onRefreshRates?.()} disabled={fxState?.loading}>
                {fxState?.loading ? "Atualizando…" : "Atualizar agora"}
              </button>
            </div>
            {fxState?.error && (
              <div className="niva-hint warn" style={{ marginBottom: 10 }}><AlertTriangle size={13} /> Falha ao buscar a cotação ao vivo ({fxState.error}). Mantendo a última cotação salva.</div>
            )}
            {CURRENCIES.filter((c) => c !== settings.currency).map((c) => (
              <div key={c} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "6px 0", fontSize: 13, borderBottom: "1px solid var(--border)" }}>
                <span>1 {c} =</span>
                <span>{Number.isFinite(settings.exchangeRates[c]) ? settings.exchangeRates[c].toLocaleString("pt-BR", { maximumFractionDigits: 4 }) : "—"} {settings.currency}</span>
              </div>
            ))}
            <div className="niva-hint" style={{ marginTop: 10 }}>Cotação obtida automaticamente de uma fonte de câmbio externa. Cada dia mantém a cotação que estava em vigor naquele dia para fins de histórico (ver Analytics).</div>
          </div>
        ) : (
          <div>
            {CURRENCIES.filter((c) => c !== settings.currency).map((c) => (
              <div key={c} style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
                <span style={{ fontSize: 13, width: 60 }}>1 {c} =</span>
                <input type="number" step="0.0001" className="niva-input" placeholder="não definida" value={settings.exchangeRates[c] || ""} onChange={(e) => setRate(c, e.target.value)} style={{ flex: 1 }} />
                <span style={{ fontSize: 13, color: "var(--muted)" }}>{settings.currency}</span>
              </div>
            ))}
          </div>
        )}
      </Card>

      <Card style={{ padding: 20 }}>
        <div style={{ fontSize: 13.5, fontWeight: 600, marginBottom: 14 }}>Reserva de imposto</div>
        <div style={{ display: "flex", gap: 10, marginBottom: 12 }}>
          <button className="niva-chip" onClick={() => set("taxReserveMode", "percent")} style={{ borderColor: settings.taxReserveMode === "percent" ? "var(--gold)" : "var(--border)", color: settings.taxReserveMode === "percent" ? "var(--gold)" : "var(--muted)" }}>Percentual</button>
          <button className="niva-chip" onClick={() => set("taxReserveMode", "manual")} style={{ borderColor: settings.taxReserveMode === "manual" ? "var(--gold)" : "var(--border)", color: settings.taxReserveMode === "manual" ? "var(--gold)" : "var(--muted)" }}>Valor manual</button>
        </div>
        {settings.taxReserveMode === "percent" ? (
          <div>
            <label className="niva-label">Percentual reservado</label>
            <input type="number" min="0" max="100" className="niva-input" value={settings.taxReservePercent} onChange={(e) => set("taxReservePercent", safeNum(e.target.value, { max: 100 }))} />
          </div>
        ) : (
          <div>
            <label className="niva-label">Valor reservado ({settings.currency})</label>
            <input type="number" min="0" className="niva-input" value={settings.taxReserveManual} onChange={(e) => set("taxReserveManual", safeNum(e.target.value))} />
          </div>
        )}
        <div className="niva-hint warn" style={{ marginTop: 12 }}><AlertTriangle size={13} /> Estimativa pessoal — não é aconselhamento fiscal oficial.</div>
      </Card>

      <BackupSection settings={settings} sessions={sessions} onImportBackup={onImportBackup} />

      <div style={{ fontSize: 12, color: "var(--muted)", marginTop: 16, lineHeight: 1.6 }}>
        Beta com interface em português. Suporte a múltiplos idiomas de interface é um trabalho futuro — os dados e cálculos não dependem do idioma.
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* Shell / navigation                                                   */
/* ------------------------------------------------------------------ */

const NAV = [
  { key: "dashboard", label: "Painel", icon: LayoutDashboard },
  { key: "calendar", label: "Calendário", icon: CalendarDays },
  { key: "twitch", label: "Twitch", icon: Radio },
  { key: "kick", label: "Kick", icon: Radio },
  { key: "youtube", label: "YouTube", icon: Radio },
  { key: "analytics", label: "Analytics", icon: BarChart3 },
  { key: "rules", label: "Regras & Fontes", icon: BookMarked },
  { key: "settings", label: "Configurações", icon: SettingsIcon },
];

function NivaApp() {
  const [loaded, setLoaded] = useState(false);
  const [settings, setSettings] = useState(DEFAULT_SETTINGS);
  const [sessions, setSessions] = useState([]);
  const [page, setPage] = useState("dashboard");
  const [openDate, setOpenDate] = useState(null);
  const [loadWarning, setLoadWarning] = useState(null); // JSON that failed to parse — NOT the normal "nothing saved yet" case
  const [quarantineInfo, setQuarantineInfo] = useState(null); // { count, reasons } — structurally invalid records found inside otherwise-readable saved data
  const [saveError, setSaveError] = useState(null); // most recent persistent-storage write failure
  const [fxState, setFxState] = useState({ loading: false, error: null }); // status of the live exchange-rate feed (Feature 12-17)

  // Global date-range filter state (Feature 1) — one range shared by Dashboard, Analytics, and
  // the platform pages. "custom" keeps its own start/end so switching away and back doesn't lose it.
  const [dateRangeType, setDateRangeType] = useState("last30days");
  const [customRange, setCustomRange] = useState({ startDate: null, endDate: null });
  const dateRange = useMemo(() => {
    if (dateRangeType === "custom" && customRange.startDate && customRange.endDate) {
      return getDateRange("custom", customRange);
    }
    return getDateRange(dateRangeType, { sessions });
  }, [dateRangeType, customRange, sessions]);
  const handleChangeCustomRange = useCallback((startDate, endDate) => {
    setCustomRange({ startDate, endDate });
    setDateRangeType("custom");
  }, []);
  const dateRangeControlNode = (
    <DateRangeFilter dateRange={dateRange} onChangeType={setDateRangeType} onChangeCustom={handleChangeCustomRange} />
  );

  const [quickAddOpen, setQuickAddOpen] = useState(false);
  const [mobileNavOpen, setMobileNavOpen] = useState(false);

  useEffect(() => {
    (async () => {
      const warnings = [];
      let loadedSettings = DEFAULT_SETTINGS;
      try {
        const s = await window.storage.get("niva:settings");
        if (s?.value) {
          try {
            const parsed = JSON.parse(s.value);
            const { settings: migrated, issues } = migrateSettings(parsed);
            loadedSettings = migrated;
            if (issues.length) warnings.push(`configurações (${issues.join("; ")})`);
          } catch (parseErr) { warnings.push("configurações (JSON corrompido)"); }
        }
      } catch (e) { /* key not found yet — normal on first run, nothing to warn about */ }
      setSettings(loadedSettings);

      try {
        const sess = await window.storage.get("niva:sessions");
        if (sess?.value) {
          try {
            const parsedRaw = JSON.parse(sess.value);
            const { sessions: clean, quarantined, sanitizedTotal } = migrateSessions(parsedRaw);
            setSessions(clean);
            if (quarantined.length > 0) {
              setQuarantineInfo({ count: quarantined.length, reasons: [...new Set(quarantined.map((q) => q.reason))] });
              // Never discarded — the raw quarantined records are kept in their own key so a human can inspect/recover them later.
              try { await window.storage.set("niva:sessions:quarantine", JSON.stringify(quarantined)); } catch (e2) { /* best effort; the in-memory warning still informs the person this run */ }
            }
            if (sanitizedTotal > 0) warnings.push(`${sanitizedTotal} valor(es) numérico(s) corrompido(s) dentro de sessões válidas foram zerados e sinalizados`);
          } catch (parseErr) { warnings.push("sessões (JSON corrompido)"); }
        }
      } catch (e) { /* key not found yet — normal on first run */ }
      if (warnings.length) setLoadWarning(`Não foi possível ler alguns dados salvos anteriormente: ${warnings.join("; ")}. Nada foi apagado — o NIVA seguiu com o que conseguiu interpretar com segurança.`);
      setLoaded(true);
    })();
  }, []);

  const persistSettings = useCallback(async (next) => {
    // Feature 18: every time exchangeRates is saved with at least one usable rate, stamp today's
    // date in rateHistory with that exact rate table. Because this only ever writes to *today's*
    // key, a past day's snapshot is never touched again once the calendar moves past it — that's
    // what lets Analytics show correct historical totals instead of repainting old days with
    // today's rate.
    const today = new Date().toISOString().slice(0, 10);
    const hasUsableRates = next.exchangeRates && Object.values(next.exchangeRates).some((v) => Number.isFinite(v) && v > 0);
    const withHistory = hasUsableRates
      ? { ...next, rateHistory: { ...(next.rateHistory || {}), [today]: { rates: next.exchangeRates, timestamp: new Date().toISOString() } } }
      : next;
    const withVersion = { ...withHistory, schemaVersion: SETTINGS_SCHEMA_VERSION };
    setSettings(withVersion);
    try {
      await window.storage.set("niva:settings", JSON.stringify(withVersion));
      setSaveError(null);
    } catch (e) {
      setSaveError("Não foi possível salvar as configurações. Suas alterações estão visíveis agora, mas podem se perder se você recarregar a página.");
    }
  }, []);

  // Fetches the live USD-based rate table and, if in "auto" mode, folds it into settings as the
  // active exchangeRates (Feature 12/14). Never invents a rate on failure — it just leaves
  // whatever was already stored and surfaces fxState.error so the person can see the feed is stale.
  const refreshLiveRates = useCallback(async () => {
    setFxState({ loading: true, error: null });
    const result = await fetchLiveUsdRates();
    if (!result.ok) { setFxState({ loading: false, error: result.error }); return; }
    const derived = deriveDisplayRates(result.usdRates, settings.currency);
    if (!derived) { setFxState({ loading: false, error: `câmbio para ${settings.currency} não encontrado na resposta` }); return; }
    if (settings.rateMode === "auto") {
      await persistSettings({ ...settings, exchangeRates: derived, exchangeRatesMeta: { updatedAt: result.timestamp, source: "live" } });
    }
    setFxState({ loading: false, error: null });
  }, [settings, persistSettings]);

  // Auto-refresh on load and whenever the display currency changes, but only in "auto" mode —
  // manual mode is entirely person-controlled and NIVA never overwrites it silently.
  useEffect(() => {
    if (!loaded) return;
    if (settings.rateMode !== "auto") return;
    refreshLiveRates();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [loaded, settings.rateMode, settings.currency]);

  const persistSessions = useCallback(async (next) => {
    setSessions(next);
    try {
      await window.storage.set("niva:sessions", JSON.stringify({ version: SESSIONS_SCHEMA_VERSION, sessions: next }));
      setSaveError(null);
    } catch (e) {
      setSaveError("Não foi possível salvar as sessões. Suas alterações estão visíveis agora, mas podem se perder se você recarregar a página.");
    }
  }, []);

  const saveSession = (sess) => {
    const exists = sessions.some((s) => s.id === sess.id);
    const next = exists ? sessions.map((s) => (s.id === sess.id ? sess : s)) : [...sessions, sess];
    persistSessions(next);
  };
  const deleteSession = (id) => persistSessions(sessions.filter((s) => s.id !== id));

  // Backup snapshot taken right before any destructive/structural operation (currently: import).
  // Kept under its own key so it never competes with or overwrites the live data.
  const backupBeforeImport = useCallback(async () => {
    try {
      await window.storage.set("niva:backup-before-import", JSON.stringify({
        savedAt: new Date().toISOString(),
        settings,
        sessions: { version: SESSIONS_SCHEMA_VERSION, sessions },
      }));
      return true;
    } catch (e) { return false; }
  }, [settings, sessions]);

  const importBackup = useCallback(async (parsedBackup) => {
    const backedUp = await backupBeforeImport();
    const { settings: migratedSettings } = migrateSettings(parsedBackup.settings);
    const { sessions: cleanSessions, quarantined } = migrateSessions(parsedBackup.sessions);
    await persistSettings(migratedSettings);
    await persistSessions(cleanSessions);
    if (quarantined.length) setQuarantineInfo({ count: quarantined.length, reasons: [...new Set(quarantined.map((q) => q.reason))] });
    return { backedUp, importedSessions: cleanSessions.length, skipped: quarantined.length };
  }, [backupBeforeImport, persistSettings, persistSessions]);

  const activePlatforms = PLATFORM_ORDER.filter((k) => settings.platforms[k]);

  if (!loaded) {
    return <div className="niva-root" style={{ display: "flex", alignItems: "center", justifyContent: "center", height: "100vh" }}><FontLoader /></div>;
  }

  if (!settings.onboarded) {
    return (
      <div className="niva-root">
        <FontLoader />
        <Onboarding onComplete={({ country, currency, platforms }) => persistSettings({ ...settings, country, currency, platforms, onboarded: true })} />
      </div>
    );
  }

  const navButton = (n, onClick) => {
    if ((n.key === "twitch" || n.key === "kick" || n.key === "youtube") && !settings.platforms[n.key]) return null;
    const Icon = n.icon;
    const active = page === n.key;
    const accent = PLATFORMS[n.key]?.accent;
    return (
      <button key={n.key} onClick={onClick} className="niva-nav-item" style={{ background: active ? "var(--surface-2)" : "transparent", color: active ? (accent || "var(--text)") : "var(--muted)" }}>
        <Icon size={16} />
        {n.label}
      </button>
    );
  };

  return (
    <div className="niva-root" style={{ display: "flex", minHeight: "100vh" }}>
      <FontLoader />
      <aside className="niva-sidebar">
        <div style={{ padding: "22px 20px 18px", fontFamily: "var(--font-display)", fontSize: 22, letterSpacing: 0.5 }}>NIVA</div>
        <div style={{ padding: "0 10px 12px" }}>
          <button className="niva-btn primary" style={{ width: "100%", justifyContent: "center" }} onClick={() => setQuickAddOpen(true)}><Plus size={15} /> Registrar Stream</button>
        </div>
        <nav style={{ display: "flex", flexDirection: "column", gap: 2, padding: "0 10px" }}>
          {NAV.map((n) => navButton(n, () => setPage(n.key)))}
        </nav>
      </aside>

      <div style={{ flex: 1, display: "flex", flexDirection: "column", minWidth: 0 }}>
        <div className="niva-mobile-topbar">
          <button className="niva-icon-btn" onClick={() => setMobileNavOpen(true)}><Menu size={18} /></button>
          <div style={{ fontFamily: "var(--font-display)", fontSize: 18 }}>NIVA</div>
          <button className="niva-icon-btn" onClick={() => setQuickAddOpen(true)}><Plus size={18} /></button>
        </div>

        <main className="niva-app-main" style={{ flex: 1, padding: "28px 32px", maxWidth: 1080 }}>
          {(loadWarning || saveError) && (
            <div className="niva-hint warn" style={{ marginBottom: 10, background: "rgba(230,120,90,0.08)", border: "1px solid rgba(230,120,90,0.25)", borderRadius: 10, padding: "10px 14px" }}>
              <AlertTriangle size={13} /> {saveError || loadWarning}
            </div>
          )}
          {quarantineInfo && (
            <div className="niva-hint warn" style={{ marginBottom: 16, background: "rgba(230,120,90,0.08)", border: "1px solid rgba(230,120,90,0.25)", borderRadius: 10, padding: "10px 14px" }}>
              <AlertTriangle size={13} /> {quarantineInfo.count} sessão(ões) salva(s) não puderam ser lidas com segurança ({quarantineInfo.reasons.join(", ")}) e ficaram fora dos seus totais — mas não foram apagadas, seguem guardadas para recuperação.
            </div>
          )}
          {page === "dashboard" && <Dashboard allSessions={sessions} settings={settings} dateRange={dateRange} dateRangeControl={dateRangeControlNode} onQuickAdd={() => setQuickAddOpen(true)} onOpenDay={setOpenDate} fxState={fxState} onRefreshRates={refreshLiveRates} />}
          {page === "calendar" && <CalendarView sessions={sessions} activePlatforms={activePlatforms} onOpenDay={setOpenDate} />}
          {(page === "twitch" || page === "kick" || page === "youtube") && <PlatformPage platform={page} sessions={sessions} settings={settings} dateRange={dateRange} dateRangeControl={dateRangeControlNode} onOpenDay={setOpenDate} onChangeSettings={persistSettings} />}
          {page === "analytics" && <Analytics sessions={sessions} settings={settings} dateRange={dateRange} dateRangeControl={dateRangeControlNode} />}
          {page === "rules" && <RulesPage />}
          {page === "settings" && <SettingsPage settings={settings} sessions={sessions} onChange={persistSettings} onImportBackup={importBackup} fxState={fxState} onRefreshRates={refreshLiveRates} />}
        </main>
      </div>

      {mobileNavOpen && (
        <>
          <div className="niva-drawer-backdrop" onClick={() => setMobileNavOpen(false)} />
          <div className="niva-drawer">
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "6px 10px 16px" }}>
              <div style={{ fontFamily: "var(--font-display)", fontSize: 20 }}>NIVA</div>
              <button className="niva-icon-btn" onClick={() => setMobileNavOpen(false)}><X size={16} /></button>
            </div>
            <nav style={{ display: "flex", flexDirection: "column", gap: 2 }}>
              {NAV.map((n) => navButton(n, () => { setPage(n.key); setMobileNavOpen(false); }))}
            </nav>
          </div>
        </>
      )}

      <button className="niva-fab" onClick={() => setQuickAddOpen(true)} aria-label="Registrar Stream"><Plus size={22} /></button>

      {quickAddOpen && (
        <QuickAddStream
          activePlatforms={activePlatforms.length ? activePlatforms : ["twitch"]}
          onSaved={saveSession}
          onClose={(openDateForRevenue) => {
            setQuickAddOpen(false);
            if (openDateForRevenue) setOpenDate(openDateForRevenue);
          }}
        />
      )}

      {openDate && (
        <DayPanel
          date={openDate}
          sessions={sessions.filter((s) => s.date === openDate)}
          activePlatforms={activePlatforms.length ? activePlatforms : ["twitch"]}
          settings={settings}
          onClose={() => setOpenDate(null)}
          onSave={saveSession}
          onDelete={deleteSession}
        />
      )}
    </div>
  );
}

function FontLoader() {
  return (
    <style>{`
